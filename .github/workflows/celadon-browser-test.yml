name: celadon · browser tests

# Separate from the gates and unit tests: this one starts a server and needs a real
# browser, so it is a step more expensive and worth its own red or green.
on:
  push:
    paths:
      - 'packages/celadon/**'
      - '.github/workflows/celadon-*.yml'
  pull_request:
    paths:
      - 'packages/celadon/**'
      - '.github/workflows/celadon-*.yml'

jobs:
  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-24.04
    env:
      # Keep the logs plain: colour codes end up as visible escape glyphs in the run summary
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/celadon
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: packages/celadon/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/celadon/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # playwright.config.ts asks for the chrome channel, and the ubuntu-24.04 image
      # already ships Google Chrome, so there is nothing to download. This step only
      # fails early and loudly if that assumption ever stops holding.
      - name: Prepare · confirm Chrome is available
        run: |
          google-chrome --version
          pnpm exec playwright --version

      # The specs start the dev server through webServer, reusing one that already runs
      - name: Browser tests
        run: pnpm test:browser

      - name: Write logs into the run summary
        if: always()
        run: |
          {
            echo "## celadon · browser test logs"
            echo
            for f in app/logs/*/*.log; do
              [ -f "$f" ] || continue
              echo "<details><summary><code>$f</code></summary>"
              echo
              echo '```'
              # Strip ANSI escapes and carriage returns: the markdown view shows them raw
              sed $'s/\x1b\\[[0-9;]*[a-zA-Z]//g' "$f" | tr -d '\r'
              echo '```'
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Traces and screenshots, for when the summary above is not enough
      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: celadon-browser-test-results
          path: |
            packages/celadon/test-results/
            packages/celadon/app/logs/
          retention-days: 7
          if-no-files-found: ignore
