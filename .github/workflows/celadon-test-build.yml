name: celadon · gates + unit tests + build

# celadon is its own package (own package.json, lockfile, workspace and pnpm version),
# so it gets its own workflow, and only runs when celadon itself changes.
on:
  push:
    paths:
      - 'packages/celadon/**'
      - '.github/workflows/celadon-*.yml'
  pull_request:
    paths:
      - 'packages/celadon/**'
      - '.github/workflows/celadon-*.yml'

jobs:
  check-test-build:
    name: Gates, unit tests, then build
    runs-on: ubuntu-24.04
    env:
      # Keep the logs plain: colour codes end up as visible escape glyphs in the run summary.
      # FORCE_COLOR only — setting NO_COLOR alongside it makes node warn that it ignores NO_COLOR.
      FORCE_COLOR: '0'
    defaults:
      run:
        working-directory: packages/celadon
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # Reads celadon's own package.json rather than the repository root, so the pnpm
      # version is pinned by this package and a root change cannot move it.
      - name: Setup Pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: packages/celadon/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # celadon has its own lockfile; pointing at the root one would cache the wrong thing
          cache-dependency-path: packages/celadon/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 1. The seven checkers. Each run writes its log into app/logs/, which the last
      #    step folds into the run summary.
      - name: Gates
        run: pnpm check

      # 2. Unit and component tests. A failure stops the job here, before any build.
      - name: Unit and component tests
        run: pnpm test

      # 3. Only reached when the two steps above pass.
      - name: Build
        run: pnpm build

      # Always runs, so a red job still shows its logs where the reviewer lands.
      - name: Write logs into the run summary
        if: always()
        run: |
          {
            echo "## celadon · logs"
            echo
            for f in app/logs/*/*.log; do
              [ -f "$f" ] || continue
              echo "<details><summary><code>$f</code></summary>"
              echo
              echo '```'
              # Strip ANSI escapes and carriage returns: the markdown view shows them raw
              sed $'s/\x1b\\[[0-9;]*[a-zA-Z]//g' "$f" | tr -d '\r'
              echo '```'
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
