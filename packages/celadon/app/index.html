<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<!-- 暂用空图标占位，消掉浏览器对 /favicon.ico 的 404；正式图标待 brand-yao-agents 落地 -->
<link rel="icon" href="data:,">
<title>CUI 2.0</title>
<script>
/* 首帧前定主题 —— 与 src/platform/theme/theme.store.ts 读同一个键、用同一条解析规则，
   否则首屏会先闪一下浅色（见 architecture/09-theme.md §1）。 */
(function () {
  var light = 'light'
  try {
    var raw = localStorage.getItem('cui.theme')
    var pref = raw ? (JSON.parse(raw).state || {}).preference : 'system'
    if (pref !== 'light' && pref !== 'dark') pref = 'system'
    var dark = pref === 'dark' ||
      (pref === 'system' && window.matchMedia &&
       window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = dark ? 'dark' : light
  } catch (e) {
    document.documentElement.dataset.theme = light
  }
})()
</script>
</head>
<body class="celadon">
  <main id="app"></main>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
