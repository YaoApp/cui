<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数据格式 · 四语对照（plan/19 的展示页）</title>
<!-- 唯一来源：tokens.less → build-css.mjs → tokens.css -->
<link rel="stylesheet" href="./tokens.css">
<style>
html,body{margin:0}
body{background:var(--background-app);color:var(--text-primary);font-family:var(--font-family-ui);
  font-size:var(--font-size-body-lg);line-height:var(--line-height-cjk);-webkit-font-smoothing:antialiased;
  padding:var(--spacing-24)}
.top{display:flex;align-items:flex-end;gap:var(--spacing-16);flex-wrap:wrap;margin-bottom:var(--spacing-16)}
h1{font-size:var(--font-size-title);font-weight:var(--font-weight-strong);margin:0}
p.sub{margin:var(--spacing-8) 0 0;color:var(--text-secondary);max-width:1000px}
.segs{margin-inline-start:auto;display:flex;gap:var(--spacing-8);flex-wrap:wrap}
.seg{display:inline-flex;gap:var(--spacing-4);padding:var(--spacing-4);border-radius:var(--radius-pill);
  border:var(--border-width) solid var(--border-control);background:var(--background-field)}
.seg button{cursor:pointer;font-family:inherit;font-size:var(--font-size-caption);
  padding:var(--spacing-4) var(--spacing-12);border:0;border-radius:var(--radius-pill);
  background:transparent;color:var(--text-secondary)}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:var(--font-weight-strong)}
.card{background:var(--background-surface);border:var(--border-width) solid var(--border-default);
  border-radius:var(--radius-large);padding:var(--spacing-16);margin-bottom:var(--spacing-16)}
.card h2{font-size:var(--font-size-subtitle);font-weight:var(--font-weight-strong);margin:0 0 var(--spacing-4)}
.card p.hint{margin:0 0 var(--spacing-12);color:var(--text-secondary);font-size:var(--font-size-caption)}
.card code{font-family:var(--font-family-monospace);font-size:var(--font-size-caption)}
/* 成对两列：一行两个，长值跨整行 */
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--spacing-32)}
@media (max-width:900px){.pairs{grid-template-columns:1fr}}
.pair{display:flex;gap:var(--spacing-12);align-items:baseline;padding:var(--spacing-8) 0;
  border-bottom:var(--border-width) solid var(--border-subtle);min-width:0}
.pair.wide{grid-column:1 / -1}
.pair .k{flex:0 0 44%;color:var(--text-secondary);font-size:var(--font-size-caption);line-height:var(--line-height-normal)}
.pair .k code{font-size:var(--font-size-label);color:var(--text-tertiary)}
.pair .v{flex:1;min-width:0;overflow-wrap:anywhere}
.pair .v code{color:var(--text-tertiary);font-size:var(--font-size-caption)}
.mono{font-family:var(--font-family-monospace);direction:ltr;unicode-bidi:isolate}
.raw{margin-top:var(--spacing-8);color:var(--text-tertiary);font-size:var(--font-size-label);font-family:var(--font-family-monospace)}
</style>
</head>
<body class="celadon">
<div class="top">
  <div>
    <h1 data-i18n="df.title"></h1>
    <p class="sub" data-i18n="df.subtitle"></p>
  </div>
  <div class="segs">
    <span class="seg" id="langSwitch">
      <button data-l="zh-CN" class="on">简</button><button data-l="zh-TW">繁</button>
      <button data-l="en">EN</button><button data-l="ja">日</button>
    </span>
    <span class="seg" id="themeSwitch">
      <button data-t="light" class="on" data-i18n="ui.theme.light"></button>
      <button data-t="dark" data-i18n="ui.theme.dark"></button>
    </span>
  </div>
</div>

<div class="card"><h2 data-i18n="df.s1title"></h2><p class="hint" data-i18n="df.s1hint"></p><div class="pairs" id="tblDate"></div></div>
<div class="card"><h2 data-i18n="df.s2title"></h2><p class="hint" data-i18n="df.s2hint"></p><div class="pairs" id="tblRel"></div></div>
<div class="card"><h2 data-i18n="df.s3title"></h2><p class="hint" data-i18n="df.s3hint"></p><div class="pairs" id="tblTz"></div><p class="raw" id="tzRaw"></p></div>
<div class="card"><h2 data-i18n="df.s4title"></h2><p class="hint" data-i18n="df.s4hint"></p><div class="pairs" id="tblNum"></div></div>
<div class="card"><h2 data-i18n="df.s5title"></h2><p class="hint" data-i18n="df.s5hint"></p><div class="pairs" id="tblSort"></div></div>
<div class="card"><h2 data-i18n="df.s6title"></h2><p class="hint" data-i18n="df.s6hint"></p><div class="pairs" id="tblRtl"></div></div>

<script src="./i18n/bundle.js"></script>
<script>
var LANG = 'zh-CN';

/* ── i18n：与其它规范页同一套机制（window.CELADON_I18N + data-i18n）── */
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function fmt(s) {   /* 支持 **粗体** 与 `代码` 两种行内标记（后者是本页多出来的） */
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
}
function tr(k) {
  var d = (window.CELADON_I18N || {})[document.documentElement.getAttribute('data-lang')] || {};
  var v = k.split('.').reduce(function (o, x) { return o == null ? undefined : o[x]; }, d);
  return v === undefined ? k : v;
}
function applyI18n() {
  [].forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.innerHTML = fmt(tr(el.getAttribute('data-i18n')));
  });
}
function pair(k, v, code, wide) {
  return '<div class="pair' + (wide ? ' wide' : '') + '"><span class="k">' + fmt(tr(k))
    + (code ? ' <code>' + esc(code) + '</code>' : '') + '</span><span class="v">' + v + '</span></div>';
}
/* 分区兜底：某个 Intl 能力缺失时，只让那一节显示原因，不把整页留白 */
function section(id, build) {
  var el = document.getElementById(id);
  try { build(el); } catch (e) {
    el.innerHTML = pair('df.missing', esc(e && e.message ? e.message : String(e)), '', true);
  }
}

/* 固定样例，保证可复现：同一时刻 / 同一数值 / 同一文件大小 */
var T = Date.UTC(2026, 8, 30, 8, 12, 34);          /* 2026-09-30T08:12:34Z */
var D = new Date(T);

function render() {
  var L = LANG;
  var dt = function (opt, date) { return new Intl.DateTimeFormat(L, opt).format(date || D); };
  var num = function (v, opt) { return new Intl.NumberFormat(L, opt || {}).format(v); };

  section('tblDate', function (el) {
    el.innerHTML =
      pair('df.dLong', esc(dt({ dateStyle: 'long' })), 'dateStyle:long') +
      pair('df.dShort', esc(dt({ dateStyle: 'short' })), 'dateStyle:short') +
      pair('df.dDateTime', esc(dt({ dateStyle: 'medium', timeStyle: 'short' })), 'dateStyle+timeStyle') +
      pair('df.dTime', esc(dt({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })), 'hourCycle:h23') +
      pair('df.dWeekday', esc(dt({ weekday: 'long' })), 'weekday:long');
  });

  section('tblRel', function (el) {
    var now = Date.now();
    var fmtAgo = function (ms) {
      var sec = Math.round(ms / 1000), d = new Date(now - ms);
      if (sec < 60) return tr('df.justNow');                      /* 规范 §3.1：不显示"20 秒钟前" */
      var rel = function (v, unit) { return new Intl.RelativeTimeFormat(L, { numeric: 'auto' }).format(v, unit); };
      if (sec < 3600) return rel(-Math.round(sec / 60), 'minute');
      if (sec < 86400) return rel(-Math.round(sec / 3600), 'hour');
      if (sec < 86400 * 7) return rel(-Math.round(sec / 86400), 'day');
      return dt({ month: 'short', day: 'numeric' }, d);
    };
    el.innerHTML =
      pair('df.rJustNow', esc(fmtAgo(20 * 1000)), '') +
      pair('df.rMinutes', esc(fmtAgo(23 * 60 * 1000)), '') +
      pair('df.rHours', esc(fmtAgo(5 * 3600 * 1000)), '') +
      pair('df.rDays', esc(fmtAgo(3 * 86400 * 1000)), '') +
      pair('df.rMd', esc(fmtAgo(12 * 86400 * 1000)), '') +
      pair('df.rYmd', esc(dt({ year: 'numeric', month: 'short', day: 'numeric' }, new Date(now - 400 * 86400 * 1000))), '');
  });

  section('tblTz', function (el) {
    var tz = function (zone) { return new Intl.DateTimeFormat(L, { dateStyle: 'short', timeStyle: 'medium', timeZone: zone }).format(D); };
    var off = function (zone) {
      var p = new Intl.DateTimeFormat('en-US', { timeZone: zone, timeZoneName: 'longOffset' }).formatToParts(D);
      return p.filter(function (x) { return x.type === 'timeZoneName'; })[0].value;
    };
    el.innerHTML =
      pair('df.tzUtc', esc(tz('UTC')), off('UTC')) +
      pair('df.tzShanghai', esc(tz('Asia/Shanghai')), off('Asia/Shanghai')) +
      pair('df.tzNewYork', esc(tz('America/New_York')), off('America/New_York')) +
      pair('df.tzBerlin', esc(tz('Europe/Berlin')), off('Europe/Berlin'));
    document.getElementById('tzRaw').textContent = tr('df.tzRaw') + '：' + new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    }).format(D).replace(/(\d+)\/(\d+)\/(\d+), (\d+):(\d+):(\d+)/, '$3-$1-$2T$4:$5:$6') + off('Asia/Shanghai') + '[Asia/Shanghai]';
  });

  section('tblNum', function (el) {
    var size = function (b) {
      if (b < 1024) return num(b) + ' B';
      var u = ['KB', 'MB', 'GB'], i = -1, v = b;
      do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
      var r = Math.round(v * 10) / 10;
      return num(r, { minimumFractionDigits: Number.isInteger(r) ? 0 : 1, maximumFractionDigits: 1 }) + ' ' + u[i];
    };
    var money = function (v, cur, narrow) {
      return new Intl.NumberFormat(L, { style: 'currency', currency: cur, currencyDisplay: narrow ? 'narrowSymbol' : 'symbol' }).format(v);
    };
    var listSample = tr('df.listSample').split('|');
    el.innerHTML =
      pair('df.nThousands', esc(num(1234.56, { minimumFractionDigits: 2 })), 'NumberFormat') +
      pair('df.nCompact', esc(num(12345, { notation: 'compact', maximumFractionDigits: 1 })), 'notation:compact') +
      pair('df.nB', esc(size(900)), 'xx B') +
      pair('df.nKb', esc(size(2.1 * 1024)), '') +
      pair('df.nMb', esc(size(1.8 * 1024 * 1024)), '1024') +
      pair('df.nMbInt', esc(size(2 * 1024 * 1024)), '') +
      pair('df.nCny', esc(money(1280, 'CNY')), 'currencyDisplay:symbol') +
      pair('df.nCnyNarrow', esc(money(1280, 'CNY', true)), 'narrowSymbol') +
      pair('df.nJpy', esc(money(1280, 'JPY')), '') +
      pair('df.nUsd', esc(money(1280, 'USD')), '') +
      pair('df.nNegative', esc(money(-100, 'CNY')), '') +
      pair('df.nList', esc(new Intl.ListFormat(L, { style: 'long', type: 'conjunction' }).format(listSample)), 'ListFormat') +
      pair('df.nRange', esc('1–3'), 'en dash') +
      pair('df.nDuration', '<span class="mono">1:23</span>', '') +
      pair('df.nDurationText', esc(tr('df.durText')), '') +
      pair('df.nTech', '<span class="mono">1.8 MB · v2.0.0 · :8080</span>', 'Latin + LTR');
  });

  section('tblSort', function (el) {
    var words = ['阿', '波', '蔡', '邓', '徐', '张'];   /* 同一份输入，四语结果不同 */
    el.innerHTML =
      pair('df.soCollator', esc(words.slice().sort(new Intl.Collator(L).compare).join(' < ')), 'Intl.Collator') +
      pair('df.soCodepoint', '<span class="mono">' + esc(words.slice().sort().join(' < ')) + '</span>', '');
  });

  section('tblRtl', function (el) {
    el.innerHTML =
      pair('df.rtlMirror', esc(tr('df.rtlMirrorValue')), '19 §4.1', true) +
      pair('df.rtlNoMirror', esc(tr('df.rtlNoMirrorValue')), '19 §4.1', true) +
      pair('df.rtlBidi', esc(tr('df.rtlBidiValue')), '19 §4.2', true);
  });
}

document.getElementById('langSwitch').addEventListener('click', function (e) {
  var b = e.target.closest('[data-l]'); if (!b) return;
  LANG = b.getAttribute('data-l');
  document.documentElement.setAttribute('data-lang', LANG);
  document.documentElement.setAttribute('lang', LANG);
  [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
  applyI18n(); render();
});
document.getElementById('themeSwitch').addEventListener('click', function (e) {
  var b = e.target.closest('[data-t]'); if (!b) return;
  document.documentElement.setAttribute('data-theme', b.getAttribute('data-t'));
  [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
});
applyI18n();
render();
</script>
</body></html>
