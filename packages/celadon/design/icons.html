<!doctype html>
<html lang="zh-CN" data-lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celadon · 图标与品牌 Icon & Brand</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--background-app);color:var(--text-primary);font-family:var(--font-family-ui);
  font-size:13px;line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:24px 24px 64px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:20px;font-weight:650}
.sub{margin:4px 0 0;color:var(--text-secondary);font-size:12.5px}
.langs{margin-left:auto;display:flex;gap:6px}
.langs button{cursor:pointer;font-family:inherit;font-size:12px;padding:4px 10px;border-radius:var(--radius-pill);
  border:1px solid var(--border-control);background:var(--background-surface);color:var(--text-secondary)}
.langs button.on{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand);font-weight:650}
.card{background:var(--background-surface);border:1px solid var(--border-default);border-radius:var(--radius-large);
  padding:16px 18px 18px;margin-bottom:18px}
h2{margin:0 0 4px;font-size:15px;font-weight:650}
h3{margin:18px 0 6px;font-size:12.5px;font-weight:650;color:var(--text-secondary)}
.note{margin:0 0 12px;color:var(--text-secondary);font-size:12.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--border-default);border-radius:var(--radius-medium);background:var(--background-content);padding:14px}
.panel .tag{float:right;font-family:var(--font-family-monospace);font-size:10.5px;color:var(--text-tertiary)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
th{font-weight:650;color:var(--text-secondary);font-size:11.5px}
code{font-family:var(--font-family-monospace);font-size:11.5px;background:var(--background-field);padding:1px 5px;border-radius:var(--radius-xs)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.toolbar input[type=search]{font-family:inherit;font-size:12.5px;padding:5px 10px;border-radius:var(--radius-small);
  border:1px solid var(--border-control);background:var(--background-field);color:var(--text-primary);width:200px}
.toolbar input[type=search]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius-pill);border:1px solid var(--border-control);background:var(--background-field)}
.seg button{cursor:pointer;font-family:var(--font-family-monospace);font-size:11.5px;padding:3px 9px;border:0;border-radius:var(--radius-pill);
  background:transparent;color:var(--text-secondary)}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:650}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 9px;border:1px solid var(--border-subtle);
  border-radius:var(--radius-medium);background:var(--background-content);cursor:pointer}
.cell:hover{border-color:var(--brand);background:var(--brand-soft)}
.cell .nm{font-family:var(--font-family-monospace);font-size:10.5px;color:var(--text-tertiary);text-align:center;word-break:break-all}
.cell .ico{color:var(--text-primary);display:flex}
.cell.ok{background:var(--success-soft);border-color:var(--success-soft)}
.brandrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brandrow .bm{width:56px;height:56px;color:var(--brand)}
.brandrow .ba{width:56px;height:56px;border-radius:var(--radius-large);overflow:hidden;border:1px solid var(--border-default)}
.brandrow .ba img{width:100%;display:block}
.sizes{display:flex;align-items:flex-end;gap:18px}
.sizes .s{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-primary)}
.sizes .s i{font-style:normal;font-family:var(--font-family-monospace);font-size:10px;color:var(--text-tertiary)}
.donot{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.dn{border:1px dashed var(--danger);border-radius:var(--radius-medium);padding:10px;font-size:11.5px;color:var(--text-secondary);background:var(--danger-soft)}
.do{border-style:solid;border-color:var(--success);background:var(--success-soft)}
.copy{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--background-surface);
  border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:6px 14px;font-size:12px;
  box-shadow:var(--shadow-floating);opacity:0;pointer-events:none;transition:opacity var(--duration-fast) var(--easing-standard)}
.copy.on{opacity:1}
ul{margin:6px 0 0;padding-left:18px}
li{margin:3px 0}
</style>
</head>

<script src="i18n/bundle.js"></script>
<script>
var SYMBOLS = ['i-chat','i-inbox','i-board','i-ws','i-pc','i-book','i-search','i-plus','i-plus-square','i-left','i-right','i-collapse','i-dots','i-file','i-split','i-send','i-check','i-clock','i-stop','i-expand','i-split2','i-spark','i-folder','i-tasks','i-pause'];
var COVER = [
  ['nav',  ['i-chat','i-inbox','i-board','i-ws','i-pc','i-book'], ['settings','help','user','team','logout']],
  ['act',  ['i-search','i-plus','i-plus-square','i-send','i-collapse','i-expand','i-split','i-split2','i-dots','i-left','i-right'], ['edit','trash','copy','download','upload','refresh','external','filter','sort','close','undo','redo','play','attach']],
  ['state',['i-check','i-clock','i-stop','i-pause','i-spark'], ['warning','error','info','loading','queued']],
  ['file', ['i-file','i-folder'], ['pdf','image','sheet','code','archive','media','text','terminal']],
  ['obj',  ['i-tasks'], ['key','schedule','integration','skill','model','quota','billing','sandbox','container','artifact']]
];
var SIZE = 16, THEME = 'light', Q = '';
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function fmt(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
function tr(k){ var d = (window.CELADON_I18N||{})[document.documentElement.getAttribute('data-lang')]||{}; var v = k.split('.').reduce(function(o,x){return o==null?null:o[x];}, d); return v==null?k:v; }
function icon(id, size){ return '<svg class="ico" width="'+size+'" height="'+size+'" viewBox="0 0 16 16" style="stroke:currentColor;fill:none;stroke-width:'+(1.6*(size/16)).toFixed(2)+';stroke-linecap:round;stroke-linejoin:round"><use href="#'+id+'"/></svg>'; }
function renderGallery(){
  var host = document.getElementById('ic-gallery');
  var list = SYMBOLS.filter(function(id){ return !Q || id.toLowerCase().indexOf(Q) >= 0; });
  host.innerHTML = list.map(function(id){
    return '<button class="cell" data-id="'+id+'">'+icon(id, SIZE)+'<span class="nm">'+id+'</span></button>'; }).join('');
  document.getElementById('ic-count').textContent = list.length + ' / ' + SYMBOLS.length;
}
function renderCover(){
  document.getElementById('ic-coverTbl').innerHTML =
    '<tr><th>'+esc(tr('ic.coverCat'))+'</th><th>'+esc(tr('ic.coverHave'))+'</th><th>'+esc(tr('ic.coverMiss'))+'</th></tr>'
    + COVER.map(function(r){
        var have = r[1].length;
        return '<tr><td>'+esc(tr('ic.cat.'+r[0]))+'</td>'
          + '<td><code>'+have+'</code> '+esc(r[1].join(' '))+'</td>'
          + '<td>'+r[2].map(function(m){ return '<code>'+m+'</code>'; }).join(' ')+' <span style="color:var(--text-tertiary)">('+r[2].length+')</span></td></tr>';
      }).join('');
}
function rows(id, keys, cols){
  var t = document.getElementById(id); if (!t) return;
  t.innerHTML = keys.map(function(r){
    return '<tr>' + r.map(function(c){ return '<' + (c[0]==='h'?'th':'td') + '>' + (c[0]==='h'? esc(tr(c[1])) : fmt(tr(c[1]))) + '</' + (c[0]==='h'?'th':'td') + '>'; }).join('') + '</tr>';
  }).join('');
}
function apply(){
  document.querySelectorAll('[id^=ic-]').forEach(function(el){
    var k = 'ic.' + el.id.slice(3); var v = tr(k); if (v !== k && el.tagName !== 'INPUT') el.innerHTML = fmt(v);
  });
  document.getElementById('ic-search').setAttribute('placeholder', tr('ic.search'));
  renderGallery(); renderCover();
  rows('ic-brandTbl', [
    [['h','ic.tblWho'],['h','ic.tblRole'],['h','ic.tblRule']],
    [['d','ic.brandWho'],['d','ic.brandRole'],['d','ic.brandRule']],
    [['d','ic.uiWho'],['d','ic.uiRole'],['d','ic.uiRule']]
  ]);
  document.getElementById('ic-brandDontList').innerHTML = ['d1','d2','d3','d4'].map(function(k){ return '<div class="dn">'+fmt(tr('ic.'+k))+'</div>'; }).join('');
  rows('ic-specTbl', [
    [['h','ic.spWhat'],['h','ic.spValue']],
    [['d','ic.spGrid'],['d','ic.spGridV']],
    [['d','ic.spStroke'],['d','ic.spStrokeV']],
    [['d','ic.spCaps'],['d','ic.spCapsV']],
    [['d','ic.spFill'],['d','ic.spFillV']],
    [['d','ic.spColor'],['d','ic.spColorV']],
    [['d','ic.spSize'],['d','ic.spSizeV']]
  ]);
  document.getElementById('ic-rules').innerHTML = ['r1','r2','r3','r4','r5'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-a11y').innerHTML = ['a1','a2','a3','a4'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-new').innerHTML = ['n1','n2','n3','n4'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-sizeDemo').innerHTML = [14,16,20,24].map(function(sz){
    return '<span class="s">'+icon('i-ws', sz)+'<i>'+sz+'px</i></span>'; }).join('');
  document.getElementById('ic-sizes').innerHTML = [14,16,20,24].map(function(sz){
    return '<button data-size="'+sz+'"'+(sz===SIZE?' class="on"':'')+'>'+sz+'</button>'; }).join('');
  document.getElementById('ic-themes').innerHTML = ['light','dark'].map(function(t){
    return '<button data-theme-sel="'+t+'"'+(t===THEME?' class="on"':'')+'>'+t+'</button>'; }).join('');
  var g = document.getElementById('ic-gallery');
  g.classList.toggle('celadon', THEME === 'dark'); g.setAttribute('data-theme', THEME);
  bind();
}
document.documentElement.setAttribute('data-lang', 'zh-CN');
document.getElementById('ic-langs').innerHTML = [['zh-CN','简'],['zh-TW','繁'],['en','EN'],['ja','日']].map(function(l){
  return '<button data-lang="'+l[0]+'"'+(l[0]==='zh-CN'?' class="on"':'')+'>'+l[1]+'</button>'; }).join('');
function bind(){
  document.querySelectorAll('#ic-langs button').forEach(function(b){ b.onclick = function(){
    var l = b.getAttribute('data-lang'); document.documentElement.setAttribute('data-lang', l);
    document.querySelectorAll('#ic-langs button').forEach(function(x){ x.classList.toggle('on', x === b); }); apply(); }; });
  document.querySelectorAll('[data-size]').forEach(function(b){ b.onclick = function(){ SIZE = parseInt(b.getAttribute('data-size'),10); apply(); }; });
  document.querySelectorAll('[data-theme-sel]').forEach(function(b){ b.onclick = function(){ THEME = b.getAttribute('data-theme-sel'); apply(); }; });
  document.querySelectorAll('.cell').forEach(function(c){ c.onclick = function(){
    var id = c.getAttribute('data-id');
    var t = document.getElementById('ic-copy');
    t.textContent = tr('ic.copied') + ' ' + id; t.classList.add('on');
    setTimeout(function(){ t.classList.remove('on'); }, 1200);
    try { if (navigator.clipboard) navigator.clipboard.writeText(id); } catch (err) {}   /* 剪贴板被拒也不影响提示 */
  }; });
}
