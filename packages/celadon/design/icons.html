<!doctype html>
<html lang="zh-CN" data-lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUI 2.0 · 图标与品牌 Icon & Brand</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin: 0;background:var(--background-app);color:var(--text-primary);font-family:var(--font-family-ui);
  font-size:var(--font-size-body-lg);line-height:var(--line-height-cjk)   /* 中文阅读页走 CJK 档 1.7：1.5 会让中文发挤 */;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin: 0 auto;padding: var(--spacing-24) var(--spacing-24) var(--spacing-48)}
.top{display:flex;align-items:flex-end;gap: var(--spacing-16);flex-wrap:wrap;margin-bottom: var(--spacing-16)}
h1{margin: 0;font-size:var(--font-size-title);font-weight:var(--font-weight-strong)}
.sub{margin: var(--spacing-4) 0 0;color:var(--text-secondary);font-size:var(--font-size-body)}
.langs{margin-left: auto;display:flex;gap: var(--spacing-4)}
.langs button{cursor:pointer;font-family:inherit;font-size:var(--font-size-caption);padding: var(--spacing-4) var(--spacing-8);border-radius:var(--radius-pill);
  border: var(--border-width) solid var(--border-control);background:var(--background-surface);color:var(--text-secondary)}
.langs button.on{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand);font-weight:var(--font-weight-strong)}
.card{background:var(--background-surface);border: var(--border-width) solid var(--border-default);border-radius:var(--radius-large);
  padding: var(--spacing-16) var(--spacing-16) var(--spacing-16);margin-bottom: var(--spacing-16)}
h2{margin: 0 0 var(--spacing-4);font-size:var(--font-size-subtitle);font-weight:var(--font-weight-strong)}
h3{margin: var(--spacing-16) 0 var(--spacing-4);font-size:var(--font-size-body);font-weight:var(--font-weight-strong);color:var(--text-secondary)}
.note{margin: 0 0 var(--spacing-12);color:var(--text-secondary);font-size:var(--font-size-body)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap: var(--spacing-12)}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.panel{border: var(--border-width) solid var(--border-default);border-radius:var(--radius-medium);background:var(--background-content);padding: var(--spacing-12)}
table{width:100%;border-collapse:collapse;font-size:var(--font-size-body)}
th,td{text-align:left;padding: var(--spacing-4) var(--spacing-8);border-bottom: var(--border-width) solid var(--border-subtle);vertical-align:top}
th{font-weight:var(--font-weight-strong);color:var(--text-secondary);font-size:var(--font-size-caption)}
/* 标签列不换行：「文件类型」「对象 / 领域」「端点 / 拐角」这类短标签不该被挤成两行；
   宽度让给内容列（语义名 / 规则说明）。品牌表首列是长句，保持可换行。 */
#ic-coverTbl td:first-child,#ic-coverTbl th:first-child,
#ic-specTbl td:first-child,#ic-specTbl th:first-child,
#ic-ruleTbl td:first-child,#ic-ruleTbl th:first-child{white-space:nowrap}
#ic-coverTbl td:last-child{overflow-wrap:anywhere}
code{font-family:var(--font-family-monospace);font-size:var(--font-size-caption);background:var(--background-field);padding: var(--spacing-4) var(--spacing-4);border-radius:var(--radius-xs)}
.toolbar{display:flex;align-items:center;gap: var(--spacing-8);flex-wrap:wrap;margin: var(--spacing-8) 0 var(--spacing-12)}
.toolbar input[type=search]{font-family:inherit;font-size:var(--font-size-body);padding: var(--spacing-4) var(--spacing-8);border-radius:var(--radius-small);
  border: var(--border-width) solid var(--border-control);background:var(--background-field);color:var(--text-primary);width:200px}
.toolbar input[type=search]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.seg{display:inline-flex;gap: var(--spacing-4);padding: var(--spacing-4);border-radius:var(--radius-pill);border: var(--border-width) solid var(--border-control);background:var(--background-field)}
.seg button{cursor:pointer;font-family:var(--font-family-monospace);font-size:var(--font-size-caption);padding: var(--spacing-4) var(--spacing-8);border:0;border-radius:var(--radius-pill);
  background:transparent;color:var(--text-secondary)}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:var(--font-weight-strong)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap: var(--spacing-8)}
.cell{display:flex;flex-direction:column;align-items:center;gap: var(--spacing-4);padding: var(--spacing-12) var(--spacing-4) var(--spacing-8);border: var(--border-width) solid var(--border-subtle);
  border-radius:var(--radius-medium);background:var(--background-content);cursor:pointer}
.cell:hover{border-color:var(--brand);background:var(--brand-soft)}
.cell .nm{font-family:var(--font-family-monospace);font-size:var(--font-size-label);color:var(--text-tertiary);text-align:center;overflow-wrap:anywhere;hyphens:auto}
.cell .src{font-family:var(--font-family-monospace);font-size:var(--font-size-label);color:var(--text-tertiary);text-align:center;overflow-wrap:anywhere}
.cell.brand{cursor:pointer}
.cell.brand .logo{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-small)}
.cell.brand .logo{color:var(--text-primary)}   /* mono 变体走 currentColor：必须显式跟随正文色，否则被 UA 默认黑吃掉 */
.cell.brand .nm{font-size:var(--font-size-label)}
/* 第三方品牌按各品牌商标规范**保留官方色**（全站唯一允许不用 token 的颜色）；深色底请切 mono 变体 */
.cell .ico{color:var(--text-primary);display:flex}
.cell.ok{background:var(--success-soft);border-color:var(--success-soft)}
.brandrow{display:flex;align-items:center;gap: var(--spacing-24);flex-wrap:wrap}
.brandrow .bm{width:56px;height:56px}
.brandrow .bm svg{display:block}   /* 品牌标记走 brand-yao-agents 符号；头部/眼睛的取色在符号内（var(--brand-graphic) / var(--brand-text)），随主题自动切换 */
.brandrow .ba{width:56px;height:56px;border-radius:var(--radius-large);overflow:hidden;border: var(--border-width) solid var(--border-default)}
.brandrow .ba img{width:100%;display:block}   /* App Icon 画布自带 22% 留白，铺满方格即可 */
.sizes{display:flex;align-items:flex-end;gap: var(--spacing-16)}
.sizes .s{display:flex;flex-direction:column;align-items:center;gap: var(--spacing-4);color:var(--text-primary)}
.sizes .s i{font-style:normal;font-family:var(--font-family-monospace);font-size:var(--font-size-label);color:var(--text-tertiary)}
.donot{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap: var(--spacing-8);margin-top: var(--spacing-8)}
.dn{border: var(--border-width) dashed var(--danger);border-radius:var(--radius-medium);padding: var(--spacing-8);font-size:var(--font-size-caption);color:var(--text-secondary);background:var(--danger-soft)}
.do{border-style:solid;border-color:var(--success);background:var(--success-soft)}
.copy{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--background-surface);
  border: var(--border-width) solid var(--border-default);border-radius:var(--radius-pill);padding: var(--spacing-4) var(--spacing-12);font-size:var(--font-size-caption);
  box-shadow:var(--shadow-floating);opacity:0;pointer-events:none;transition:opacity var(--duration-fast) var(--easing-standard)}
.copy.on{opacity:1}
ul{margin: var(--spacing-4) 0 0;padding-left: var(--spacing-16)}
li{margin: var(--spacing-4) 0}
</style>
</head>

  ['state', ['i-check','i-clock','i-spark','i-state-warning','i-state-error','i-state-info','i-state-loading','i-state-queued']],
  ['obj', ['i-tasks','i-obj-key','i-obj-schedule','i-obj-integration','i-obj-skill','i-obj-model','i-obj-quota','i-obj-billing','i-obj-sandbox','i-obj-container','i-obj-artifact']],
  ['brand', ['brand-yao-agents','brand-yao-agents-mono','brand-yao','brand-yao-mono']]
];
var SIZE = 24, THEME = 'light', Q = '';   /* 画廊默认 24：产品落地仍按规范用 16，这里放大只为了看清 */
var TR_THEME = { light: '浅色', dark: '暗色' };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function fmt(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
function tr(k){ var d = (window.CELADON_I18N||{})[document.documentElement.getAttribute('data-lang')]||{}; var v = k.split('.').reduce(function(o,x){return o==null?null:o[x];}, d); return v==null?k:v; }
function icon(id, size){ return '<svg class="ico" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#'+id+'"/></svg>'; }
function brandTile(b){
  var useMono = BVARIANT === 'mono';
  var id = (useMono && b.mono && b.color) ? b.id + '-mono' : b.id;
  var ownMono = b.lib === 'own' && useMono && document.getElementById(b.id + '-mono');
  // 品牌雪碧图按体积分片（外部 use 对单文件体积有上限），index 里带着分片号
  // 外部来源各自的雪碧图分片：brand-sprite-N（AI 品牌）/ brand-simple-N（通用品牌）；自有品牌用内联符号
  var file = b.lib === 'simpleicons' ? 'brand-simple-' : 'brand-sprite-';
  var href = b.lib === 'own' ? ('#' + b.id + (ownMono ? '-mono' : '')) : ('icons/' + file + (b.shard || 1) + '.svg#' + id);
  return '<button class="cell brand" data-id="'+b.id+'" title="'+b.title+'" data-primary="'+(b.primary||'')+'">'
    + '<span class="logo"><svg width="'+BSIZE+'" height="'+BSIZE+'" viewBox="0 0 24 24" style="display:block"><use href="'+href+'"/></svg></span>'
    + '<span class="nm">'+b.id+'</span><span class="src">'+b.title+'</span></button>';
}
  var LUCIDE_COUNT = Object.keys(LUCIDE).length;   /* 界面图标真实数量 */
  var I18N_N = { 'ic.setTitle': LUCIDE_COUNT, 'ic.galleryTitle': LUCIDE_COUNT };   /* 标题里的 {n} 由它填 */
function renderBrands(){
  var host = document.getElementById('ic-brandgallery'); if (!host) return;
  var ours = OWNBRANDS;   /* 自有品牌排第一第二 */
  var list = ours.concat(BRANDS).filter(function(b){ return !BQ || (b.id+' '+b.title).toLowerCase().indexOf(BQ) >= 0; });
  host.innerHTML = list.map(brandTile).join('');
  document.getElementById('ic-brandcount').textContent = list.length + ' / ' + (BRANDS.length + ours.length);
  document.getElementById('ic-brandsizes').innerHTML = [14,16,20,24].map(function(sz){
    return '<button data-brand-size="'+sz+'"'+(sz===BSIZE?' class="on"':'')+'>'+sz+'</button>'; }).join('');
  document.getElementById('ic-brandvariant').innerHTML = ['color','mono'].map(function(v){
    return '<button data-brand-variant="'+v+'"'+(v===BVARIANT?' class="on"':'')+'>'+tr(v==='color'?'ic.brandColor':'ic.brandMono')+'</button>'; }).join('');
}
function renderGallery(){
  var host = document.getElementById('ic-gallery');
  var list = SYMBOLS.filter(function(id){ return !Q || id.toLowerCase().indexOf(Q) >= 0; });
  host.innerHTML = list.map(function(id){
    var own = OWN.indexOf(id) >= 0;
    return '<button class="cell'+(own?' own':'')+'" data-id="'+id+'" title="'+(own?'own':('lucide:'+LUCIDE[id]))+'">'+icon(id, SIZE)+'<span class="nm">'+id+'</span><span class="src">'+(own?tr('ic.srcOwn'):LUCIDE[id])+'</span></button>'; }).join('');
  document.getElementById('ic-count').textContent = list.length + ' / ' + SYMBOLS.length;
}
function renderCover(){
  document.getElementById('ic-coverTbl').innerHTML =
    '<tr><th>'+esc(tr('ic.coverCat'))+'</th><th>'+esc(tr('ic.coverCount'))+'</th><th>'+esc(tr('ic.coverNames'))+'</th></tr>'
    + COVER.filter(function(r){ return r[0] !== 'brand'; }).map(function(r){
        return '<tr><td>'+esc(tr('ic.cat.'+r[0]))+'</td>'
          + '<td><code>'+r[1].length+'</code></td>'
          + '<td>'+(r[1].map(function(m){ return '<code>'+m+'</code>'; }).join(' '))+'</td></tr>';
      }).join('')
    + '<tr><td>'+esc(tr('ic.cat.brand'))+'</td><td><code>'+(BRANDS.length + OWNBRANDS.length)+'</code></td>'
    + '<td>'+esc(tr('ic.coverBrandNote').replace('{own}', OWNBRANDS.length).replace('{third}', BRANDS.length))+'</td></tr>';
}
function rows(id, keys, cols){
  var t = document.getElementById(id); if (!t) return;
  t.innerHTML = keys.map(function(r){
    return '<tr>' + r.map(function(c){ return '<' + (c[0]==='h'?'th':'td') + '>' + (c[0]==='h'? esc(tr(c[1])) : fmt(tr(c[1]))) + '</' + (c[0]==='h'?'th':'td') + '>'; }).join('') + '</tr>';
  }).join('');
}
function apply(){
  document.querySelectorAll('[id^=ic-]').forEach(function(el){
    var k = 'ic.' + el.id.slice(3); var v = tr(k);
    if (I18N_N[k] !== undefined) v = String(v).replace('{n}', I18N_N[k]);   /* 数量类文案由页面自己数，不写死 */
    if (v !== k && el.tagName !== 'INPUT') el.innerHTML = fmt(v);
  });
  document.getElementById('ic-search').setAttribute('placeholder', tr('ic.search'));
  var bsr = document.getElementById('ic-brandsearch'); if (bsr) bsr.setAttribute('placeholder', tr('ic.brandSearch'));
  TR_THEME = { light: tr('ic.themeLight'), dark: tr('ic.themeDark') };
  renderGallery(); renderCover();
  rows('ic-brandTbl', [
    [['h','ic.tblWho'],['h','ic.tblRole'],['h','ic.tblRule']],
    [['d','ic.brandWho'],['d','ic.brandRole'],['d','ic.brandRule']],
    [['d','ic.uiWho'],['d','ic.uiRole'],['d','ic.uiRule']]
  ]);
  document.getElementById('ic-brandDontList').innerHTML = ['d1','d2','d3','d4'].map(function(k){ return '<div class="dn">'+fmt(tr('ic.'+k))+'</div>'; }).join('');
  rows('ic-specTbl', [
    [['h','ic.spWhat'],['h','ic.spValue']],
    [['d','ic.spGrid'],['d','ic.spGridV']],
    [['d','ic.spStroke'],['d','ic.spStrokeV']],
    [['d','ic.spCaps'],['d','ic.spCapsV']],
    [['d','ic.spFill'],['d','ic.spFillV']],
    [['d','ic.spColor'],['d','ic.spColorV']],
    [['d','ic.spSize'],['d','ic.spSizeV']],
    [['d','ic.spCorner'],['d','ic.spCornerV']],
    [['d','ic.spGap'],['d','ic.spGapV']]
  ]);
  document.getElementById('ic-rules').innerHTML = ['r1','r2','r3','r4','r5'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  rows('ic-ruleTbl', [
    [['h','ic.rWhat'],['h','ic.rMust']],
    [['d','ic.rt1'],['d','ic.rv1']],
    [['d','ic.rt2'],['d','ic.rv2']],
    [['d','ic.rt3'],['d','ic.rv3']],
    [['d','ic.rt4'],['d','ic.rv4']],
    [['d','ic.rt5'],['d','ic.rv5']],
    [['d','ic.rt6'],['d','ic.rv6']]
  ]);
  document.getElementById('ic-rsList').innerHTML = ['rs1','rs2','rs3','rs4','rs5','rs6'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-rxList').innerHTML = ['rx1','rx2','rx3'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-a11y').innerHTML = ['a1','a2','a3','a4'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-new').innerHTML = ['n1','n2','n3','n4'].map(function(k){ return '<li>'+fmt(tr('ic.'+k))+'</li>'; }).join('');
  document.getElementById('ic-sizeDemo').innerHTML = [14,16,20,24].map(function(sz){
    return '<span class="s">'+icon('i-ws', sz)+'<i>'+sz+'px</i></span>'; }).join('');
  document.getElementById('ic-sizes').innerHTML = [14,16,20,24].map(function(sz){
    return '<button data-size="'+sz+'"'+(sz===SIZE?' class="on"':'')+'>'+sz+'</button>'; }).join('');
  document.documentElement.setAttribute('data-theme', THEME);   /* 整页切换：浅/暗同时作用于卡片、文字、图标 */
  document.getElementById('ic-page-themes').innerHTML = ['light','dark'].map(function(t){
    return '<button data-theme-sel="'+t+'"'+(t===THEME?' class="on"':'')+'>'+TR_THEME[t]+'</button>'; }).join('');
  renderBrands();
  bind();
}
document.documentElement.setAttribute('data-lang', 'zh-CN');
document.getElementById('ic-langs').innerHTML = [['zh-CN','简'],['zh-TW','繁'],['en','EN'],['ja','日']].map(function(l){
  return '<button data-lang="'+l[0]+'"'+(l[0]==='zh-CN'?' class="on"':'')+'>'+l[1]+'</button>'; }).join('');
function bind(){
  document.querySelectorAll('#ic-langs button').forEach(function(b){ b.onclick = function(){
    var l = b.getAttribute('data-lang'); document.documentElement.setAttribute('data-lang', l);
    document.querySelectorAll('#ic-langs button').forEach(function(x){ x.classList.toggle('on', x === b); }); apply(); }; });
  document.querySelectorAll('[data-size]').forEach(function(b){ b.onclick = function(){ SIZE = parseInt(b.getAttribute('data-size'),10); apply(); }; });
  document.querySelectorAll('[data-theme-sel]').forEach(function(b){ b.onclick = function(){ THEME = b.getAttribute('data-theme-sel'); apply(); }; });
  var bs = document.getElementById('ic-brandsearch');
  if (bs && !bs.dataset.done) { bs.dataset.done = '1'; bs.addEventListener('input', function(e){ BQ = e.target.value.trim().toLowerCase(); renderBrands(); bind(); }); }
  document.querySelectorAll('[data-brand-variant]').forEach(function(b){ b.onclick = function(){ BVARIANT = b.getAttribute('data-brand-variant'); renderBrands(); bind(); }; });
  document.querySelectorAll('[data-brand-size]').forEach(function(b){ b.onclick = function(){ BSIZE = parseInt(b.getAttribute('data-brand-size'),10); renderBrands(); bind(); }; });
  document.querySelectorAll('.cell').forEach(function(c){ c.onclick = function(){
    var id = c.getAttribute('data-id');
    var t = document.getElementById('ic-copy');
    t.textContent = tr('ic.copied') + ' ' + id; t.classList.add('on');
    setTimeout(function(){ t.classList.remove('on'); }, 1200);
    try { if (navigator.clipboard) navigator.clipboard.writeText(id); } catch (err) {}   /* 剪贴板被拒也不影响提示 */
  }; });
}
document.getElementById('ic-search').addEventListener('input', function(e){ Q = e.target.value.trim().toLowerCase(); renderGallery(); });
apply();
</script>
</body>
</html>
