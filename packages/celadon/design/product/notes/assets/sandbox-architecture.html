<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f6f8fb; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b6bb1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fb"/>

  <text x="80" y="76" font-size="40" font-weight="700" fill="#172033">Sandbox 架构</text>
  <text x="82" y="112" font-size="18" fill="#64748b">资源生命周期独立于 Session 状态</text>

  <g font-size="15" fill="#475569">
    <line x1="1180" y1="82" x2="1220" y2="82" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1232" y="87">控制</text>
    <line x1="1180" y1="108" x2="1220" y2="108" stroke="#8b6bb1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-soft)"/>
    <text x="1232" y="113">生命周期</text>
  </g>

  <!-- controller -->
  <g filter="url(#shadow)">
    <rect x="80" y="160" width="1440" height="112" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
  </g>
  <text x="112" y="198" font-size="20" font-weight="700" fill="#253247">Sandbox Controller</text>
  <text x="112" y="226" font-size="15" fill="#526173">allocate · resume · reclaim</text>
  <g font-size="15" fill="#526173">
    <rect x="700" y="185" width="210" height="52" rx="12" fill="#eef3fb" stroke="#b8c6d8"/>
    <text x="805" y="217" text-anchor="middle">allocate</text>
    <rect x="930" y="185" width="210" height="52" rx="12" fill="#eef3fb" stroke="#b8c6d8"/>
    <text x="1035" y="217" text-anchor="middle">resume</text>
    <rect x="1160" y="185" width="210" height="52" rx="12" fill="#fff1e8" stroke="#e3b38d"/>
    <text x="1265" y="217" text-anchor="middle">reclaim</text>
  </g>

  <path d="M 800 272 L 800 330" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 1035 272 L 1035 330" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 1265 272 L 1265 330" fill="none" stroke="#8b6bb1" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-soft)"/>

  <!-- sandbox instance -->
  <g filter="url(#shadow)">
    <rect x="80" y="332" width="1440" height="286" rx="18" fill="#ffffff" stroke="#9db3c7" stroke-width="2"/>
  </g>
  <text x="112" y="374" font-size="22" font-weight="700" fill="#1e3a52">Sandbox Instance</text>
  <text x="112" y="400" font-size="14" fill="#60758a">一台电脑上的执行环境</text>

  <g filter="url(#shadow)">
    <rect x="120" y="430" width="360" height="130" rx="14" fill="#e5f2fd" stroke="#3282c4" stroke-width="1.6"/>
    <rect x="530" y="430" width="360" height="130" rx="14" fill="#eef3fb" stroke="#8296ad" stroke-width="1.6"/>
    <rect x="940" y="430" width="360" height="130" rx="14" fill="#fff5dc" stroke="#b9831f" stroke-width="1.6"/>
    <rect x="1350" y="430" width="120" height="130" rx="14" fill="#f3f5f8" stroke="#c3cedb" stroke-width="1.4"/>
  </g>

  <text x="300" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#123f63">Runtime</text>
  <text x="300" y="498" text-anchor="middle" font-size="14" fill="#35617f">DSH / Pi / Tool Runner</text>
  <text x="300" y="526" text-anchor="middle" font-size="14" fill="#59758a">Turn / Step 执行</text>

  <text x="710" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#243447">Workspace Volume</text>
  <text x="710" y="498" text-anchor="middle" font-size="14" fill="#5b6b7f">文件 · 代码 · 缓存</text>
  <text x="710" y="526" text-anchor="middle" font-size="14" fill="#5b6b7f">随 Sandbox 保留或重建</text>

  <text x="1120" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#6b4708">Jobs / Subagents</text>
  <text x="1120" y="498" text-anchor="middle" font-size="14" fill="#7a5a1d">后台 job</text>
  <text x="1120" y="526" text-anchor="middle" font-size="14" fill="#7a5a1d">异步 subagent</text>

  <text x="1410" y="485" text-anchor="middle" font-size="14" fill="#5e6877">Session</text>
  <text x="1410" y="510" text-anchor="middle" font-size="14" fill="#5e6877">Attach</text>

  <!-- sessions -->
  <g filter="url(#shadow)">
    <rect x="1180" y="660" width="320" height="90" rx="14" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
  </g>
  <text x="1210" y="692" font-size="17" font-weight="700" fill="#253247">Session A</text>
  <text x="1210" y="718" font-size="14" fill="#5b6b7f">Turn 输入 · 事件 · 控制</text>
  <path d="M 1410 560 L 1410 652" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="660" width="320" height="90" rx="14" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
  </g>
  <text x="110" y="692" font-size="17" font-weight="700" fill="#253247">Session B</text>
  <text x="110" y="718" font-size="14" fill="#5b6b7f">同一 Sandbox 上的另一 Session</text>
  <path d="M 240 560 L 240 652" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- lifecycle strip -->
  <g filter="url(#shadow)">
    <rect x="430" y="660" width="700" height="90" rx="14" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
  </g>
  <text x="460" y="690" font-size="17" font-weight="700" fill="#253247">Sandbox 生命周期</text>
  <text x="460" y="718" font-size="14" fill="#526173">active → pausing → paused → resuming → active</text>
  <text x="460" y="740" font-size="13" fill="#7a5a1d">超时回收：active → pausing → paused</text>

  <path d="M 760 618 L 760 652" fill="none" stroke="#8b6bb1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-soft)"/>

  <!-- bottom note -->
  <text x="80" y="826" font-size="16" fill="#526173">Session 状态：idle / running / waiting / cancelling / closed</text>
  <text x="80" y="852" font-size="16" fill="#526173">Sandbox 状态：active / paused / resuming；强制回收只改变 Sandbox，不改 Session 状态机</text>
</svg>
</body>
</html>
