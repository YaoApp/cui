<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f6f8fb; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b6bb1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f6f8fb"/>

  <text x="80" y="76" font-size="40" font-weight="700" fill="#172033">Session 生命周期</text>
  <text x="82" y="112" font-size="18" fill="#64748b">动作 · Turn / Step · 后台工作 · 连接状态</text>

  <g font-size="15" fill="#475569">
    <line x1="1170" y1="82" x2="1210" y2="82" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1222" y="87">动作</text>
    <line x1="1170" y1="108" x2="1210" y2="108" stroke="#8b6bb1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-soft)"/>
    <text x="1222" y="113">后台事件</text>
  </g>

  <!-- idle -->
  <g filter="url(#shadow)">
    <rect x="110" y="330" width="190" height="100" rx="16" fill="#eef3fb" stroke="#8296ad" stroke-width="2"/>
  </g>
  <text x="205" y="374" text-anchor="middle" font-size="26" font-weight="700" fill="#243447">idle</text>
  <text x="205" y="401" text-anchor="middle" font-size="15" fill="#5b6b7f">没有 open Turn</text>

  <!-- running -->
  <g filter="url(#shadow)">
    <rect x="390" y="330" width="220" height="100" rx="16" fill="#e5f2fd" stroke="#3282c4" stroke-width="2"/>
  </g>
  <text x="500" y="374" text-anchor="middle" font-size="26" font-weight="700" fill="#123f63">running</text>
  <text x="500" y="401" text-anchor="middle" font-size="15" fill="#35617f">Turn 正在执行</text>
  <text x="500" y="422" text-anchor="middle" font-size="13" fill="#59758a">Step 1..N</text>

  <!-- waiting -->
  <g filter="url(#shadow)">
    <rect x="710" y="330" width="210" height="100" rx="16" fill="#fff5dc" stroke="#b9831f" stroke-width="2"/>
  </g>
  <text x="815" y="374" text-anchor="middle" font-size="26" font-weight="700" fill="#6b4708">waiting</text>
  <text x="815" y="401" text-anchor="middle" font-size="15" fill="#7a5a1d">pending request</text>
  <text x="815" y="422" text-anchor="middle" font-size="13" fill="#8b6a2a">approval / question</text>

  <!-- cancelling -->
  <g filter="url(#shadow)">
    <rect x="1010" y="330" width="210" height="100" rx="16" fill="#ffeadb" stroke="#c06a23" stroke-width="2"/>
  </g>
  <text x="1115" y="374" text-anchor="middle" font-size="26" font-weight="700" fill="#70380d">cancelling</text>
  <text x="1115" y="401" text-anchor="middle" font-size="15" fill="#7d4a22">正在取消</text>

  <!-- closed -->
  <g filter="url(#shadow)">
    <rect x="1320" y="330" width="190" height="100" rx="16" fill="#eceff3" stroke="#77808d" stroke-width="2"/>
  </g>
  <text x="1415" y="374" text-anchor="middle" font-size="26" font-weight="700" fill="#303845">closed</text>
  <text x="1415" y="401" text-anchor="middle" font-size="15" fill="#5e6877">Session 已结束</text>

  <!-- arrows -->
  <g fill="none" stroke="#64748b" stroke-width="2.2">
    <path d="M 300 365 L 382 365" marker-end="url(#arrow)"/>
    <path d="M 610 365 L 702 365" marker-end="url(#arrow)"/>
    <path d="M 920 365 L 1002 365" marker-end="url(#arrow)"/>

    <!-- resolve, over the top -->
    <path d="M 800 330 C 800 140 500 140 500 322" marker-end="url(#arrow)"/>

    <!-- running turn.end to idle -->
    <path d="M 500 430 C 500 485 205 485 205 438" marker-end="url(#arrow)"/>

    <!-- running cancel to cancelling -->
    <path d="M 500 430 C 500 555 1115 555 1115 438" marker-end="url(#arrow)"/>

    <!-- cancelling turn.end to idle -->
    <path d="M 1115 430 C 1115 615 205 615 205 438" marker-end="url(#arrow)"/>

    <!-- close bus -->
    <path d="M 205 438 L 205 700 L 1510 700 L 1510 438" marker-end="url(#arrow)"/>
  </g>

  <!-- async work -->
  <g fill="none" stroke="#8b6bb1" stroke-width="2.2" stroke-dasharray="8 6">
    <path d="M 205 430 C 205 530 500 530 500 438" marker-end="url(#arrow-soft)"/>
  </g>

  <!-- labels -->
  <g font-size="18" fill="#475569" paint-order="stroke" stroke="#f6f8fb" stroke-width="7" stroke-linejoin="round">
    <text x="341" y="351" text-anchor="middle">prompt</text>
    <text x="660" y="351" text-anchor="middle">request</text>
    <text x="966" y="351" text-anchor="middle">cancel</text>
    <text x="650" y="143" text-anchor="middle">resolve</text>
    <text x="365" y="468" text-anchor="middle">turn.end</text>
    <text x="805" y="548" text-anchor="middle">cancel</text>
    <text x="655" y="607" text-anchor="middle">turn.end(aborted)</text>
    <text x="805" y="689" text-anchor="middle">close(reason)</text>
  </g>
  <g font-size="17" fill="#79539a" paint-order="stroke" stroke="#f6f8fb" stroke-width="7" stroke-linejoin="round">
    <text x="350" y="522" text-anchor="middle">work.settled → 新 Turn</text>
  </g>

  <!-- running self badge -->
  <g filter="url(#shadow)">
    <rect x="407" y="190" width="252" height="62" rx="14" fill="#ffffff" stroke="#9db3c7" stroke-width="1.5"/>
  </g>
  <text x="533" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">followup → queued</text>
  <text x="533" y="238" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">steer → steering</text>
  <path d="M 533 252 L 533 322" fill="none" stroke="#9db3c7" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- idle annotation -->
  <rect x="103" y="248" width="204" height="34" rx="17" fill="#ffffff" stroke="#c3cedb" stroke-width="1.3"/>
  <text x="205" y="270" text-anchor="middle" font-size="14" fill="#5e6d80">activeWork 可保留</text>
  <line x1="205" y1="282" x2="205" y2="322" stroke="#c3cedb" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- closed reason -->
  <rect x="1236" y="448" width="346" height="25" fill="#f6f8fb"/>
  <text x="1238" y="466" font-size="14" fill="#5e6877">reason: completed / error / aborted</text>

  <!-- bottom cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="755" width="460" height="190" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
    <rect x="570" y="755" width="460" height="190" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
    <rect x="1060" y="755" width="460" height="190" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5"/>
  </g>

  <text x="112" y="798" font-size="20" font-weight="700" fill="#253247">Turn</text>
  <text x="112" y="830" font-size="15" fill="#526173">prompt / followup / work 开始</text>
  <text x="112" y="857" font-size="15" fill="#526173">一个 Turn 包含 1..N 个 Step</text>
  <text x="112" y="884" font-size="15" fill="#526173">turn.reason: prompt / followup / work</text>
  <text x="112" y="911" font-size="15" fill="#526173">turn.end: completed / error / aborted</text>

  <text x="602" y="798" font-size="20" font-weight="700" fill="#253247">Step</text>
  <text x="602" y="830" font-size="15" fill="#526173">一次模型调用 + 工具执行</text>
  <text x="602" y="857" font-size="15" fill="#526173">Step 边界：模型与工具都落定</text>
  <text x="602" y="884" font-size="15" fill="#526173">steer 在边界进入下一 Step</text>
  <text x="602" y="911" font-size="15" fill="#526173">followup 不进入当前 Step</text>

  <text x="1092" y="798" font-size="20" font-weight="700" fill="#253247">后台与连接</text>
  <text x="1092" y="830" font-size="15" fill="#526173">job / subagent 可跨 turn.end 运行</text>
  <text x="1092" y="857" font-size="15" fill="#526173">idle + activeWork → 新 Turn(work)</text>
  <text x="1092" y="884" font-size="15" fill="#526173">close 取消 activeWork</text>
  <text x="1092" y="911" font-size="15" fill="#526173">断线只改变连接，不改变 Session</text>

  <!-- footer -->
  <line x1="80" y1="730" x2="1520" y2="730" stroke="#e1e7ef" stroke-width="1"/>
</svg>
</body>
</html>
