<!doctype html>
<html lang="zh-CN" class="celadon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celadon Foundations · 间距 · 圆角 · 层级 · 动效 · 边框</title>
<link rel="stylesheet" href="./tokens.css">
<style>
*{box-sizing:border-box} html,body{margin:0}
body{font:13px/1.5 var(--font-family-ui);background:var(--background-app);color:var(--text-primary);-webkit-font-smoothing:antialiased;padding:22px 22px 60px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--text-secondary);font-size:12.5px;margin:0 0 10px}
.src{font-size:11.5px;color:var(--text-tertiary);background:var(--background-surface);border:1px solid var(--border-default);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:14px}
code{font-family:var(--font-family-monospace);background:var(--background-field);padding:1px 5px;border-radius:4px;font-size:11.5px}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;background:color-mix(in srgb, var(--background-app) 92%, transparent);backdrop-filter:blur(6px);padding:8px 0 12px;margin-bottom:8px}
.language-switch{display:flex;gap:4px}
.toolbar button{font:inherit;font-size:12px;padding:5px 12px;border-radius:var(--radius-pill);border:1px solid var(--border-control);background:var(--background-surface);color:var(--text-secondary);cursor:pointer}
.toolbar button.on{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink);font-weight:650}
/* 预览控件（放在各自卡片里；真实偏好仍由 tokens.less 的媒体查询控制） */
.prefbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:2px 0 12px}
.pf-label{font-size:11.5px;color:var(--text-secondary);font-weight:var(--font-weight-medium)}
.seg-group{display:inline-flex;border:1px solid var(--border-control);border-radius:var(--radius-pill);overflow:hidden;background:var(--background-surface)}
.seg{font:inherit;font-size:11.5px;padding:4px 13px;border:0;background:transparent;color:var(--text-secondary);cursor:pointer;border-right:1px solid var(--border-subtle)}
.seg:last-child{border-right:0}
.seg:hover{background:var(--background-hover)}
.seg.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:650}
.pf-note{font-size:11px;color:var(--text-tertiary)}
/* 动效强度：减少（时长归零）/ 标准 / 丰富（更长） */
body.mo-low, body.mo-low .celadon, body.mo-low .celadon[data-theme='dark'], body.mo-low [data-theme='dark'] .celadon{
  --duration-fast:0.01ms;--duration-base:0.01ms;--duration-slow:0.01ms}
body.mo-rich, body.mo-rich .celadon, body.mo-rich .celadon[data-theme='dark'], body.mo-rich [data-theme='dark'] .celadon{
  --duration-fast:var(--duration-fast-rich);--duration-base:var(--duration-base-rich);--duration-slow:var(--duration-slow-rich)}
/* 对比度偏好：低 / 标准 / 高 */
body.ct-low, body.ct-low .celadon, body.ct-low .celadon[data-theme='dark'], body.ct-low [data-theme='dark'] .celadon{
  --border-control:var(--border-control-low);--border-hover:var(--border-hover-low)}
body.ct-high, body.ct-high .celadon, body.ct-high .celadon[data-theme='dark'], body.ct-high [data-theme='dark'] .celadon{
  --border-control:var(--border-control-strong);--border-hover:var(--border-hover-strong)}
.dim-note{font-size:11.5px;color:var(--text-tertiary)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.panel{min-width:0;border-radius:14px;overflow:hidden;border:1px solid var(--border-subtle);background:var(--background-content);color:var(--text-primary)}
.panel .hd{padding:9px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--border-subtle);background:var(--background-navigation);display:flex;align-items:center;gap:8px}
.panel .hd .tag{margin-left:auto;font-weight:400;font-size:11px;color:var(--text-tertiary)}
.pbody{padding:12px 15px 16px}
.grp{margin:0 0 14px;font-size:11.5px;letter-spacing:.3px;font-weight:var(--font-weight-medium);color:var(--text-secondary);padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}
.card{min-width:0;background:var(--background-surface);border:1px solid var(--border-default);border-radius:12px;padding:14px 16px;margin-top:18px}
.card h2{font-size:13.5px;margin:0 0 6px}
.card .hint{font-size:11.5px;color:var(--text-secondary);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
th{color:var(--text-secondary);font-weight:650;font-size:11.5px}
ul{margin:0;padding-left:18px} li{font-size:12px;color:var(--text-secondary);margin:3px 0}
/* 间距刻度 */
.sp-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.sp-name{font-family:var(--font-family-monospace);font-size:11.5px;width:104px;flex:none;color:var(--text-primary)}
.sp-val{font-family:var(--font-family-monospace);font-size:11px;color:var(--text-tertiary);width:40px;flex:none;text-align:right}
.sp-bar{height:14px;border-radius:3px;background:var(--brand-soft);border:1px solid var(--brand-display);flex:none}
.sp-demo{margin-top:10px;background:var(--background-surface);border:1px solid var(--border-default);border-radius:var(--radius-large);padding:var(--spacing-16)}
.sp-demo h4{margin:0 0 var(--spacing-8);font-size:12.5px}
.sp-demo p{margin:0 0 var(--spacing-8);font-size:11.5px;color:var(--text-secondary)}
.sp-demo .row{display:flex;gap:var(--spacing-12)}
.sp-demo .b{padding:var(--spacing-6) var(--spacing-12);border-radius:var(--radius-medium);background:var(--brand-soft);color:var(--brand-ink);font-size:11.5px;font-weight:650}
/* 圆角 */
.rad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rad-item{text-align:center}
.rad-box{height:58px;background:var(--background-field);border:1px solid var(--border-default);margin-bottom:6px}
.rad-item .n{font-family:var(--font-family-monospace);font-size:11px;color:var(--text-primary)}
.rad-item .u{font-size:10.5px;color:var(--text-tertiary);margin-top:2px}
/* 层级 */
.el-stack{position:relative;height:214px}
.el-card{position:absolute;border-radius:var(--radius-large);background:var(--background-surface);border:1px solid var(--border-default);padding:9px 12px;font-size:11.5px;width:214px;white-space:nowrap;overflow:hidden}
.el-card .t{font-weight:650;font-size:12px}
.el-card .m{font-family:var(--font-family-monospace);font-size:10.5px;color:var(--text-tertiary)}
/* 动效 */
.mo-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.mo-name{font-family:var(--font-family-monospace);font-size:11.5px;width:126px;flex:none}
.mo-bar{height:12px;border-radius:3px;background:var(--brand-soft);border:1px solid var(--brand-display);flex:none}
.mo-val{font-family:var(--font-family-monospace);font-size:11px;color:var(--text-tertiary)}
.curve-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.curve{border:1px solid var(--border-subtle);border-radius:10px;padding:8px 10px}
.curve svg{display:block;width:100%;height:86px}
.curve .cn{font-family:var(--font-family-monospace);font-size:11px;margin-top:5px}
/* ===== 动效：常用场景画廊（全部真实可操作）===== */
.mo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:1560px){.mo-grid{grid-template-columns:1fr}}
.mo-scene{min-width:0;border:1px solid var(--border-subtle);border-radius:10px;padding:9px 11px;background:var(--background-content)}
.mo-head{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:11.5px;min-width:0}
.mo-head .n{font-weight:650;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-head .tk{font-family:var(--font-family-monospace);font-size:10px;color:var(--text-tertiary)}
.mo-head .go{margin-left:auto}
.mo-hint{font-size:10.5px;color:var(--text-tertiary);white-space:nowrap}
.stage{position:relative;height:84px;border-radius:var(--radius-medium);background:var(--background-field);border:1px solid var(--border-default);overflow:hidden}
.stage.tall{height:114px}
.stage .el{position:absolute;transition-property:opacity,transform,background-color,border-color,box-shadow;transition-duration:var(--d,200ms);transition-timing-function:var(--e,linear)}
/* 通用演示件 */
.stage .act{padding:4px 11px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-control);color:var(--text-primary);font:inherit;font-size:11px;cursor:pointer;transition:background-color var(--duration-fast) var(--easing-standard)}
.stage .act:hover{background:var(--background-hover)}
.stage .ln{display:block;height:6px;border-radius:3px;background:var(--background-field)}
.stage .page{left:0;right:0;top:0;bottom:0;padding:12px;display:flex;flex-direction:column;gap:8px}
.stage .page .ln{background:var(--border-subtle)}
/* 1 悬停过渡（真实 :hover） */
.s-hover .chip{left:12px;top:30px;padding:5px 15px;border-radius:var(--radius-pill);background:var(--background-surface);border:1px solid var(--border-control);color:var(--text-secondary);font-size:11px;font-weight:650}
.s-hover .chip:hover{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink)}
/* 2 按下反馈（真实 :active） */
.s-press .btn{left:12px;top:27px;padding:6px 18px;border-radius:var(--radius-medium);background:var(--brand);color:var(--brand-text);font-size:11px;font-weight:650}
.s-press .btn:active{transform:scale(.94)}
/* 3 焦点环（真实 input :focus） */
.s-focus .inp{left:12px;top:26px;width:146px;height:32px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-control);box-shadow:0 0 0 0 transparent;font:inherit;font-size:11.5px;color:var(--text-primary);padding:0 10px}
.s-focus .inp:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);outline:none}
/* 4 淡入（拨开关） */
.s-fade .sw{left:12px;top:32px;width:36px;height:20px;border-radius:var(--radius-pill);background:var(--background-surface);border:1px solid var(--border-control);cursor:pointer;padding:0}
.s-fade .sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-tertiary);transition:transform var(--d) var(--e),background-color var(--d) var(--e)}
.s-fade.on .sw{background:var(--brand-soft);border-color:var(--brand-ink)}
.s-fade.on .sw i{transform:translateX(16px);background:var(--brand-ink)}
.s-fade .card{left:62px;top:14px;width:152px;height:44px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-default);display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 11px;opacity:0}
.s-fade.on .card{opacity:1}
/* 5 下拉出现（点触发按钮） */
.s-dropdown .trg{left:12px;top:26px;padding:5px 13px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-control);color:var(--text-primary);font:inherit;font-size:11.5px;cursor:pointer}
.s-dropdown .menu{left:12px;top:54px;width:146px;padding:6px 0;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-default);box-shadow:var(--shadow-floating);transform-origin:top left;opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none;z-index:20}
.s-dropdown .menu i{display:block;height:7px;margin:5px 10px;border-radius:3px;background:var(--background-field)}
.s-dropdown.open .menu{opacity:1;transform:none;pointer-events:auto}
/* 6 面板展开（点行头） */
.s-panel .hdr{left:12px;top:12px;right:12px;height:30px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-default);cursor:pointer;display:flex;align-items:center;padding:0 11px;font-size:11.5px;color:var(--text-primary)}
.s-panel .hdr::after{content:'▾';margin-left:auto;color:var(--text-tertiary);font-size:10px}
.s-panel .bd{left:12px;top:46px;right:12px;height:28px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-default);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 11px;opacity:0;transform:translateY(-6px)}
.s-panel.open .bd{opacity:1;transform:none}
/* 7 面板收起（点面板） */
.s-collapse .p{left:12px;top:12px;right:12px;height:62px;border-radius:var(--radius-large);background:var(--background-surface);border:1px solid var(--border-default);display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 11px;cursor:pointer}
.s-collapse .p .cb{transition-property:opacity,transform;transition-duration:var(--d);transition-timing-function:var(--e)}
.s-collapse.collapsed .p .cb{opacity:0;transform:translateY(-4px)}
.s-collapse.collapsed .p{opacity:.65}
/* 8 抽屉滑入（点页内按钮；点遮罩关闭） */
.s-drawer .scrim{left:0;right:0;top:0;bottom:0;background:var(--scrim);opacity:0;pointer-events:none}
.s-drawer .sheet{right:0;top:0;bottom:0;width:152px;background:var(--background-surface);border-left:1px solid var(--border-default);box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 12px;transform:translateX(105%);pointer-events:none}
.s-drawer.open .sheet{transform:none;pointer-events:auto}
.s-drawer.open .scrim{opacity:1;pointer-events:auto}
.s-drawer .act{left:12px;bottom:12px}
/* 9 弹窗出现（点页内按钮；点遮罩关闭） */
.s-modal .scrim{left:0;right:0;top:0;bottom:0;background:var(--scrim);opacity:0;pointer-events:none}
.s-modal .dlg{left:50%;top:50%;width:158px;height:58px;margin:-29px 0 0 -79px;border-radius:var(--radius-large);background:var(--background-surface);border:1px solid var(--border-default);box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 12px;opacity:0;transform:scale(.96);pointer-events:none}
.s-modal.open .dlg{opacity:1;transform:none;pointer-events:auto}
.s-modal.open .scrim{opacity:1;pointer-events:auto}
.s-modal .act{left:12px;bottom:12px}
/* 10 通知出现（点页内按钮；自动消失 / 点它关闭） */
.s-toast .toast{left:12px;bottom:12px;padding:8px 14px;border-radius:var(--radius-medium);background:var(--background-surface);border:1px solid var(--border-default);box-shadow:var(--shadow-floating);font-size:11.5px;color:var(--text-primary);opacity:0;transform:translateY(8px);cursor:pointer;pointer-events:none}
.s-toast.on .toast{opacity:1;transform:none;pointer-events:auto}
.s-toast .act{left:12px;top:14px}
/* 11 列表依次进入（点重新加载） */
.s-list .act{left:12px;top:12px}
.s-list .row{left:12px;right:12px;height:18px;border-radius:5px;background:var(--background-surface);border:1px solid var(--border-default);display:flex;align-items:center;gap:7px;padding:0 8px}
.s-list .row:nth-of-type(1){top:44px}
.s-list .row:nth-of-type(2){top:68px}
.s-list .row:nth-of-type(3){top:92px}
.s-list .row b{width:6px;height:6px;border-radius:50%;background:var(--brand-display);flex:none}
.s-list .row i{flex:1;height:5px;border-radius:3px;background:var(--background-field)}
.s-list .row:nth-of-type(2){transition-delay:60ms}
.s-list .row:nth-of-type(3){transition-delay:120ms}
.s-list.reset .row{opacity:0;transform:translateY(6px)}
/* 12 流式输出（点重新生成） */
.s-stream .act{left:12px;top:12px}
.s-stream .line{left:14px;top:54px;right:14px;display:flex;align-items:center;gap:2px}
.s-stream .txt{font-size:11.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden}
.s-stream .caret{width:2px;height:14px;background:var(--brand);flex:none;opacity:0}
.s-stream.typing .caret{opacity:1;animation:celadon-caret 1s steps(1) infinite}
@keyframes celadon-caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.rm-note{margin-top:8px;font-size:11.5px;padding:6px 10px;border-radius:8px;background:var(--background-field);border:1px solid var(--border-default);color:var(--text-secondary)}
/* 边框 */
.bd-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.bd-line{width:120px;height:0;border-top:2px solid;flex:none}
.bd-name{font-family:var(--font-family-monospace);font-size:11.5px;width:150px;flex:none}
.bd-cr{font-size:10.5px;padding:2px 7px;border-radius:99px;flex:none;font-weight:650;border:1px solid transparent;min-width:56px;text-align:center}
.bd-cr.ok{color:var(--success);background:var(--success-soft);border-color:color-mix(in srgb, var(--success) 30%, var(--success-soft))}
.bd-cr.dim{color:var(--text-tertiary);background:var(--background-field);border-color:var(--border-default)}
.bd-demo{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.bd-demo .col{flex:1;min-width:180px}
.bd-demo .cap{font-size:11px;color:var(--text-tertiary);margin-bottom:5px}
.bd-demo input{width:100%;height:34px;font:inherit;font-size:12.5px;border-radius:var(--radius-medium);padding:0 10px;background:var(--background-field);color:var(--text-primary)}
.dev{margin-top:10px;font-size:11.5px;line-height:1.55;color:var(--text-secondary);background:var(--warm-soft);border:1px solid color-mix(in srgb, var(--warm) 30%, var(--warm-soft));color:var(--warm-text);border-radius:9px;padding:8px 11px}
</style>
</head>
<body>
<!-- 真实偏好由 tokens.css 的媒体查询处理；下面两个开关只是"预览不同状态" -->

<h1 id="f-title"></h1>
<p class="sub" id="f-sub"></p>
<p class="src" id="f-src"></p>

<div class="toolbar">
  <span class="language-switch">
    <button data-lang="zh-CN">简</button><button data-lang="zh-TW">繁</button>
    <button data-lang="en">EN</button><button data-lang="ja">日</button>
  </span>
  <span class="dim-note" id="f-langnote"></span>
</div>

<!-- F1 间距 -->
<div class="card">
  <h2 id="sp-title"></h2><p class="hint" id="sp-note"></p>
  <div class="cols">
    <section class="panel" id="sp-light"></section>
    <section class="panel celadon" data-theme="dark" id="sp-dark"></section>
  </div>
</div>

<!-- F2 圆角 -->
<div class="card">
  <h2 id="rd-title"></h2><p class="hint" id="rd-note"></p>
  <div class="cols">
    <section class="panel" id="rd-light"></section>
    <section class="panel celadon" data-theme="dark" id="rd-dark"></section>
  </div>
</div>

<!-- F3 层级 -->
<div class="card">
  <h2 id="el-title"></h2><p class="hint" id="el-note"></p>
  <p class="hint" id="el-note2" style="color:var(--text-tertiary)"></p>
  <div class="cols">
    <section class="panel" id="el-light"></section>
    <section class="panel celadon" data-theme="dark" id="el-dark"></section>
  </div>
  <div class="cols" style="margin-top:14px">
    <div><table id="el-table-light"></table></div>
    <div><table id="el-table-dark"></table></div>
  </div>
</div>

<!-- F4 动效 -->
<div class="card">
  <h2 id="mo-title"></h2><p class="hint" id="mo-note"></p>
  <div class="prefbar"><span class="pf-label" id="mo-pref-label"></span><span class="seg-group" id="mo-pref"></span><span class="pf-note" id="mo-pref-note"></span></div>
  <div class="cols">
    <section class="panel" id="mo-light"></section>
    <section class="panel celadon" data-theme="dark" id="mo-dark"></section>
  </div>
</div>

<!-- F5 边框 -->
<div class="card">
  <h2 id="bd-title"></h2><p class="hint" id="bd-note"></p>
  <div class="prefbar"><span class="pf-label" id="bd-pref-label"></span><span class="seg-group" id="bd-pref"></span><span class="pf-note" id="bd-pref-note"></span></div>
  <div class="cols">
    <section class="panel" id="bd-light"></section>
    <section class="panel celadon" data-theme="dark" id="bd-dark"></section>
  </div>
</div>

<div id="probe-light" class="celadon" aria-hidden="true" style="position:absolute;left:-9999px;top:0"></div>
<div id="probe-dark" class="celadon" data-theme="dark" aria-hidden="true" style="position:absolute;left:-9999px;top:0"></div>

<script src="./i18n/bundle.js"></script>
<script>
var BUNDLE = window.CELADON_I18N || {};
var CURRENT = 'zh-CN';
function lookup(lang, key){ var d = BUNDLE[lang]; if (!d) return null;
  return key.split('.').reduce(function(o,k){ return o == null ? null : o[k]; }, d); }
function tr(key){ var v = lookup(CURRENT, key); if (v == null) v = lookup('zh-CN', key); return v == null ? key : v; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===== 从 tokens.css 实时读值（浅/暗各一份）===== */
var PROBE = { light: document.getElementById('probe-light'), dark: document.getElementById('probe-dark') };
/* 偏好：sys = 系统真实值；sim = 本页预览开关（用于检查不同状态下的样子） */
var PREF = { motion:'std', contrast:'std' };          /* std 之外都是"预览模拟" */
function sysRM(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches }
function rmOn(){ return PREF.motion === 'low' || sysRM() }
function segHtml(group, opts, cur){
  return opts.map(function(o){ return '<button class="seg'+(o[0]===cur?' on':'')+'" type="button" data-pref="'+group+'" data-level="'+o[0]+'">'+esc(tr(o[1]))+'</button>'; }).join('');
}
function applyPrefs(){
  document.body.classList.toggle('mo-low', PREF.motion === 'low');
  document.body.classList.toggle('mo-rich', PREF.motion === 'rich');
  document.body.classList.toggle('ct-low', PREF.contrast === 'low');
  document.body.classList.toggle('ct-high', PREF.contrast === 'high');
  var l1 = document.getElementById('mo-pref-label');
  if (l1){
    l1.textContent = tr('f.pref.motionLabel');
    document.getElementById('mo-pref').innerHTML = segHtml('motion', [['low','f.pref.mLow'],['std','f.pref.mStd'],['rich','f.pref.mRich']], PREF.motion);
    document.getElementById('mo-pref-note').textContent = tr('f.pref.sys') + (sysRM() ? tr('f.pref.mLow') : tr('f.pref.mStd'))
      + (PREF.motion !== 'std' ? ' · ' + tr('f.pref.simulating') : '');
  }
  var l2 = document.getElementById('bd-pref-label');
  if (l2){
    l2.textContent = tr('f.pref.contrastLabel');
    document.getElementById('bd-pref').innerHTML = segHtml('contrast', [['low','f.pref.cLow'],['std','f.pref.cStd'],['high','f.pref.cHigh']], PREF.contrast);
    document.getElementById('bd-pref-note').textContent = PREF.contrast !== 'std' ? tr('f.pref.simulating') : '';
  }
}
function tok(name, theme){ return getComputedStyle(PROBE[theme]).getPropertyValue(name).trim(); }
function px(v){ return parseFloat(v) || 0; }

/* ===== 对比度（与色卡同一算法）===== */
function toRGB(v){
  if (!v) return null;
  if (v[0] === '#'){ var h = v.slice(1); if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
  var m = v.match(/rgba?\(([^)]+)\)/); if (!m) return null;
  return m[1].split(',').map(parseFloat).slice(0,3);
}
function lum(v){ var c = toRGB(v); if (!c) return null;
  var f = function(x){ x = x/255; return x <= 0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4); };
  return 0.2126*f(c[0]) + 0.7152*f(c[1]) + 0.0722*f(c[2]); }
function cr(a,b){ var l1 = lum(a), l2 = lum(b); if (l1 == null || l2 == null) return null;
  var hi = Math.max(l1,l2), lo = Math.min(l1,l2); return Math.round(((hi+0.05)/(lo+0.05))*100)/100; }

/* ===== F1 间距 ===== */
var SPACING = ['--spacing-2','--spacing-4','--spacing-6','--spacing-8','--spacing-12','--spacing-16','--spacing-24','--spacing-32','--spacing-48'];
function renderSpacing(theme){
  var scale = '<div class="grp">'+esc(tr('f.spacing.scale'))+'</div>' + SPACING.map(function(t){
    var v = px(tok(t, theme));
    return '<div class="sp-row"><span class="sp-name">'+t+'</span><span class="sp-val">'+v+'px</span>'
      + '<span class="sp-bar" style="width:'+Math.min(v*2.6,190)+'px"></span></div>'; }).join('');
  var usage = '<div class="grp" style="margin-top:14px">'+esc(tr('f.spacing.usage'))+'</div>'
    + '<table><tr><td>'+esc(tr('f.spacing.u1'))+'</td><td><code>4 · 6 · 8 · 12</code></td></tr>'
    + '<tr><td>'+esc(tr('f.spacing.u2'))+'</td><td><code>8 · 12 · 16</code></td></tr>'
    + '<tr><td>'+esc(tr('f.spacing.u3'))+'</td><td><code>24 · 32 · 48</code></td></tr>'
    + '<tr><td>'+esc(tr('f.spacing.u4'))+'</td><td><code>16 · 24</code></td></tr></table>';
  var demo = '<div class="grp" style="margin-top:14px">'+esc(tr('f.spacing.example'))+'</div>'
    + '<div class="sp-demo"><h4>'+esc(tr('f.spacing.title'))+'</h4><p>'+esc(tr('f.spacing.note'))+'</p>'
    + '<div class="row"><span class="b">primary</span><span class="b">ghost</span></div></div>';
  document.getElementById(theme === 'dark' ? 'sp-dark' : 'sp-light').innerHTML =
    '<div class="hd">'+(theme === 'dark' ? 'Dark' : 'Light')+'<span class="tag">--spacing-*</span></div><div class="pbody">'+scale+usage+demo+'</div>';
}

/* ===== F2 圆角 ===== */
var RADII = [['--radius-small','r1'],['--radius-medium','r2'],['--radius-large','r3'],['--radius-pill','r4']];
function renderRadius(theme){
  var grid = '<div class="grp">'+esc(tr('f.radius.usage'))+'</div><div class="rad-grid">' + RADII.map(function(p){
    var v = tok(p[0], theme);
    return '<div class="rad-item"><div class="rad-box" style="border-radius:'+v+'"></div>'
      + '<div class="n">'+p[0].replace('--radius-','')+' · '+v+'</div>'
      + '<div class="u">'+esc(tr('f.radius.'+p[1]))+'</div></div>'; }).join('') + '</div>';
  document.getElementById(theme === 'dark' ? 'rd-dark' : 'rd-light').innerHTML =
    '<div class="hd">'+(theme === 'dark' ? 'Dark' : 'Light')+'<span class="tag">--radius-*</span></div><div class="pbody">'+grid+'</div>';
}

/* ===== F3 层级 ===== */
/* 层级映射：L2 浮层必须高于 sticky(100)，L3 弹窗再高一层；sticky 见表格附注 */
var LEVELS = [['lv0','--z-base','--shadow-none','use0','--background-content'],['lv1','--z-raised','--shadow-subtle','use1','--elevation-surface-1'],
              ['lv2','--z-overlay','--shadow-floating','use2','--elevation-surface-2'],['lv3','--z-modal','--shadow-overlay','use3','--elevation-surface-3']];
function renderElevation(theme){
  var stack = '<div class="grp">'+esc(tr('f.elevation.levels'))+'</div><div class="el-stack">' + LEVELS.map(function(l,i){
    var sh = l[2] === '--shadow-none' ? 'none' : tok(l[2], theme);
    var pos = ['left:0;top:0','left:34px;top:50px','left:68px;top:100px','left:102px;top:150px'][i];
    return '<div class="el-card" style="'+pos+';background:'+tok(l[4],theme)+';box-shadow:'+sh+';z-index:'+tok(l[1],theme)+'">'
      + '<div class="t">'+esc(tr('f.elevation.'+l[0]))+'</div><div class="m">'+(l[2] === '--shadow-none' ? 'shadow: none' : l[2])+' · z '+tok(l[1],theme)+'</div>'
      + '<div class="m">'+l[4].replace('--','')+'</div></div>'; }).join('') + '</div>';
  document.getElementById(theme === 'dark' ? 'el-dark' : 'el-light').innerHTML =
    '<div class="hd">'+(theme === 'dark' ? 'Dark' : 'Light')+'<span class="tag">elevation</span></div><div class="pbody">'+stack+'</div>';
  document.getElementById(theme === 'dark' ? 'el-table-dark' : 'el-table-light').innerHTML =
    '<tr><th>'+esc(tr('f.elevation.colLevel'))+'</th><th>'+esc(tr('f.elevation.colShadow'))+'</th><th>'+esc(tr('f.elevation.colSurface'))+'</th><th>'+esc(tr('f.elevation.colZ'))+'</th><th>'+esc(tr('f.elevation.colUse'))+'</th></tr>'
    + LEVELS.map(function(l){ return '<tr><td>'+esc(tr('f.elevation.'+l[0]))+'</td><td><code>'+(l[2]==='--shadow-none'?'—':l[2])+'</code></td>'
      + '<td><code>'+l[4]+'</code></td><td><code>'+tok(l[1],theme)+'</code></td><td>'+esc(tr('f.elevation.'+l[3]))+'</td></tr>'; }).join('')
    + '<tr><td>sticky</td><td><code>--shadow-subtle</code></td><td><code>--background-navigation</code></td><td><code>'+tok('--z-sticky',theme)+'</code></td><td>'+esc(tr('f.elevation.useSticky'))+'</td></tr>';
}

/* ===== F4 动效 ===== */
var DURATIONS = ['--duration-fast','--duration-base','--duration-slow'];
var CURVES = [['--easing-standard','square'],['--easing-decelerate','enter'],['--easing-accelerate','exit']];
function curvePath(v){
  var m = String(v).match(/cubic-bezier\(([^)]+)\)/); if (!m) return 'M0,100 C0,100 100,0 100,0';
  var n = m[1].split(',').map(parseFloat);
  var X = function(x){ return Math.round(x*100); }, Y = function(y){ return Math.round(100 - y*100); };
  return 'M0,100 C'+X(n[0])+','+Y(n[1])+' '+X(n[2])+','+Y(n[3])+' 100,0';
}
/* ===== F4 动效：常用场景画廊（**全部真实可操作**；无播放按钮）===== */
var SCENES = ['hover','press','focus','fade','dropdown','panel','collapse','drawer','modal','toast','list','stream'];
var SCENE_TOKENS = {
  hover:['--duration-fast','--easing-standard'], press:['--duration-fast','--easing-standard'], focus:['--duration-fast','--easing-standard'],
  fade:['--duration-base','--easing-decelerate'], dropdown:['--duration-base','--easing-decelerate'], panel:['--duration-base','--easing-decelerate'],
  collapse:['--duration-fast','--easing-accelerate'], drawer:['--duration-slow','--easing-decelerate'], modal:['--duration-base','--easing-decelerate'],
  toast:['--duration-base','--easing-decelerate'], list:['--duration-base','--easing-decelerate'], stream:['--duration-base','--easing-standard']
};
/* 每行右侧的提示：用户真实要做的动作 */
var SCENE_HINT = {
  hover:'f.motion.hint.hover', press:'f.motion.hint.press', focus:'f.motion.hint.focus',
  fade:'f.motion.hint.toggle', dropdown:'f.motion.hint.click', panel:'f.motion.hint.click', collapse:'f.motion.hint.click',
  drawer:'f.motion.hint.click', modal:'f.motion.hint.click', toast:'f.motion.hint.click', list:'f.motion.hint.click', stream:'f.motion.hint.click'
};
function pageSkeleton(lines){
  var out = '';
  for (var i = 0; i < lines.length; i++) out += '<i class="ln" style="width:'+lines[i]+'%"></i>';
  return out;
}
function stageHtml(theme, id){
  var inner = '', tall = '';
  switch (id){
    case 'hover':    inner = '<span class="el chip">'+esc(tr('f.motion.demoBtn'))+'</span>'; break;
    case 'press':    inner = '<span class="el btn">'+esc(tr('f.motion.demoBtn'))+'</span>'; break;
    case 'focus':    inner = '<input class="el inp" value="">'; break;
    case 'fade':     inner = '<button class="el sw" type="button" aria-label="toggle"><i></i></button>'
                            + '<span class="el card"><i class="ln" style="width:58%"></i><i class="ln" style="width:86%"></i></span>'; break;
    case 'dropdown': inner = '<button class="el trg" type="button">'+esc(tr('f.motion.act.menu'))+'</button>'
                            + '<span class="el menu"><i></i><i></i><i></i></span>'; break;
    case 'panel':    inner = '<span class="el hdr">'+esc(tr('f.motion.demoPanel'))+'</span>'
                            + '<span class="el bd"><i class="ln" style="width:56%"></i><i class="ln" style="width:82%"></i></span>'; break;
    case 'collapse': inner = '<span class="el p"><i class="ln cb" style="width:50%"></i><i class="ln cb" style="width:78%"></i></span>'; break;
    case 'drawer':   inner = '<span class="el page">'+pageSkeleton([46,70,58])
                            + '<button class="act" type="button" data-act="drawer">'+esc(tr('f.motion.act.drawer'))+'</button></span>'
                            + '<span class="el scrim" data-close="drawer"></span>'
                            + '<span class="el sheet"><i class="ln" style="width:56%"></i><i class="ln" style="width:82%"></i><i class="ln" style="width:66%"></i></span>'; break;
    case 'modal':    inner = '<span class="el page">'+pageSkeleton([48,72,60])
                            + '<button class="act" type="button" data-act="modal">'+esc(tr('f.motion.act.modal'))+'</button></span>'
                            + '<span class="el scrim" data-close="modal"></span>'
                            + '<span class="el dlg"><i class="ln" style="width:52%"></i><i class="ln" style="width:84%"></i></span>'; break;
    case 'toast':    inner = '<span class="el page"><i class="ln" style="width:52%"></i><i class="ln" style="width:74%"></i>'
                            + '<button class="act" type="button" data-act="toast">'+esc(tr('f.motion.act.toast'))+'</button></span>'
                            + '<span class="el toast" data-close="toast">'+esc(tr('f.motion.demoToast'))+'</span>'; break;
    case 'list':     tall = ' tall';
                     inner = '<button class="el act" type="button" data-act="list">'+esc(tr('f.motion.act.list'))+'</button>'
                            + '<span class="el row"><b></b><i></i></span><span class="el row"><b></b><i></i></span><span class="el row"><b></b><i></i></span>'; break;
    case 'stream':   tall = ' tall';
                     inner = '<button class="el act" type="button" data-act="stream">'+esc(tr('f.motion.act.stream'))+'</button>'
                            + '<span class="el line"><span class="txt"></span><span class="caret"></span></span>'; break;
  }
  var t = SCENE_TOKENS[id];
  return '<div class="stage s-'+id+tall+'" id="stage-'+theme+'-'+id+'" style="--d:'+tok(t[0],theme)+';--e:'+tok(t[1],theme)+'">'+inner+'</div>';
}
function streamScene(st){
  var txt = st.querySelector('.txt'), full = tr('f.motion.demoStream');
  clearInterval(st._timer); st.classList.add('typing'); txt.textContent = '';
  if (rmOn()){ txt.textContent = full; return; }
  var i = 0;
  st._timer = setInterval(function(){
    i += 2; txt.textContent = full.slice(0, i);
    if (i >= full.length){ clearInterval(st._timer);
      setTimeout(function(){ st.classList.remove('typing'); }, 1400); }
  }, 45);
}
/* 真实操作 → 场景状态 */
function runAction(theme, act){
  var st = document.getElementById('stage-'+theme+'-'+act); if (!st) return;
  if (act === 'fade'){ st.classList.toggle('on'); return; }
  if (act === 'panel'){ st.classList.toggle('open'); return; }
  if (act === 'collapse'){ st.classList.toggle('collapsed'); return; }
  if (act === 'drawer' || act === 'modal'){ st.classList.add('open'); return; }
  if (act === 'toast'){ st.classList.add('on'); clearTimeout(st._t);
    st._t = setTimeout(function(){ st.classList.remove('on'); }, 1600); return; }
  if (act === 'list'){ st.classList.remove('reset'); void st.offsetWidth;
    st.classList.add('reset'); void st.offsetWidth;
    clearTimeout(st._t); st._t = setTimeout(function(){ st.classList.remove('reset'); }, 24); return; }
  if (act === 'stream'){ streamScene(st); return; }
}
function renderMotion(theme){
  var dur = '<div class="grp">'+esc(tr('f.motion.scale'))+'</div>' + DURATIONS.map(function(t){
    var v = px(tok(t, theme));
    return '<div class="mo-row"><span class="mo-name">'+t+'</span><span class="mo-val">'+v+'ms</span>'
      + '<span class="mo-bar" style="width:'+Math.round(v/1.8)+'px"></span></div>'; }).join('');
  var curves = '<div class="grp" style="margin-top:14px">'+esc(tr('f.motion.curves'))+'</div><div class="curve-grid">' + CURVES.map(function(c){
    var v = tok(c[0], theme);
    return '<div class="curve"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
      + '<path d="'+curvePath(v)+'" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" style="color:var(--brand)"/>'
      + '<line x1="0" y1="100" x2="100" y2="0" stroke="currentColor" stroke-width="0.7" stroke-dasharray="3 3" style="color:var(--border-default)"/></svg>'
      + '<div class="cn">'+c[0].replace('--easing-','')+'</div></div>'; }).join('') + '</div>';
  var gallery = '<div class="grp" style="margin-top:16px">'+esc(tr('f.motion.scenes'))+'</div>'
    + '<div class="mo-grid">' + SCENES.map(function(id){
        var t = SCENE_TOKENS[id];
        return '<div class="mo-scene"><div class="mo-head"><span class="n">'+esc(tr('f.motion.s.'+id))+'</span>'
          + '<span class="tk">'+t[0].replace('--duration-','')+' · '+t[1].replace('--easing-','')+'</span>'
          + '<span class="mo-hint go">'+esc(tr(SCENE_HINT[id]))+'</span></div>'
          + stageHtml(theme, id) + '</div>'; }).join('') + '</div>';
  var rm = '<div class="rm-note" id="rm-'+theme+'"></div>';
  var rules = '<div class="grp" style="margin-top:14px">'+esc(tr('f.motion.rules'))+'</div><ul>'
    + ['r1','r2','r3','r4'].map(function(k){ return '<li>'+esc(tr('f.motion.'+k))+'</li>'; }).join('') + '</ul>';
  document.getElementById(theme === 'dark' ? 'mo-dark' : 'mo-light').innerHTML =
    '<div class="hd">'+(theme === 'dark' ? 'Dark' : 'Light')+'<span class="tag">duration · easing</span></div><div class="pbody">'+dur+curves+gallery+rm+rules+'</div>';
  var el = document.getElementById('rm-'+theme);
  if (el) el.textContent = rmOn() ? tr('f.motion.reducedOn') : tr('f.motion.reducedOff');
}

/* ===== F5 边框 ===== */
var BORDERS = [['--border-subtle','line'],['--border-default','line'],['--border-control','control'],['--border-hover','hover'],['--border-control-strong','strong']];
function renderBorder(theme){
  var field = tok('--background-field', theme), content = tok('--background-content', theme), bgApp = tok('--background-app', theme);
  var ramp = '<div class="grp">'+esc(tr('f.border.ramp'))+'</div>' + BORDERS.map(function(b){
    var v = tok(b[0], theme), c1 = cr(v, field), c2 = cr(v, content);
    var isControl = b[1] === 'control' || b[1] === 'hover' || b[1] === 'strong';
    var cls = c1 >= 3 ? 'ok' : 'dim';
    return '<div class="bd-row"><span class="bd-line" style="border-color:'+v+'"></span><span class="bd-name">'+b[0]+'</span>'
      + '<span class="bd-cr '+cls+'">'+c1+':1</span><span class="bd-cr dim">'+c2+':1</span>'
      + '<span class="mo-val">'+esc(tr('f.border.on'))+'</span></div>'; }).join('');
  var demo = '<div class="grp" style="margin-top:14px">'+esc(tr('f.border.demo'))+'</div><div class="bd-demo">'
    + '<div class="col"><div class="cap">'+esc(tr('f.border.demoDefault'))+'</div><input value="tsk_8f21c4" style="border:1px solid '+tok('--border-control',theme)+'"></div>'
    + '<div class="col"><div class="cap">'+esc(tr('f.border.demoStrong'))+'</div><input value="tsk_8f21c4" style="border:1px solid '+tok('--border-control-strong',theme)+'"></div>'
    + '</div>';
  var dec = '<div class="grp" style="margin-top:14px">'+esc(tr('f.border.decision'))+'</div><ul>'
    + ['d1','d2','d3'].map(function(k){ return '<li>'+esc(tr('f.border.'+k))+'</li>'; }).join('') + '</ul>'
    + '<div class="dev">'+esc(tr('f.border.deviation'))+'</div>';
  document.getElementById(theme === 'dark' ? 'bd-dark' : 'bd-light').innerHTML =
    '<div class="hd">'+(theme === 'dark' ? 'Dark' : 'Light')+'<span class="tag">border · contrast</span></div><div class="pbody">'+ramp+demo+dec+'</div>';
}

/* ===== 语言 / 渲染 ===== */
function applyChrome(){
  document.getElementById('f-title').textContent = tr('f.title');
  document.getElementById('f-sub').textContent = tr('f.subtitle');
  document.getElementById('f-src').textContent = tr('f.source');
  document.getElementById('f-langnote').textContent = tr('f.langnote');
  var map = [['sp','spacing'],['rd','radius'],['el','elevation'],['mo','motion'],['bd','border']];
  map.forEach(function(m){
    document.getElementById(m[0]+'-title').textContent = tr('f.'+m[1]+'.title');
    document.getElementById(m[0]+'-note').textContent = tr('f.'+m[1]+'.note');
  });
  var n2 = document.getElementById('el-note2'); if (n2) n2.textContent = tr('f.elevation.note2');
}
function renderAll(){
  applyChrome(); applyPrefs();
  ['light','dark'].forEach(function(t){ renderSpacing(t); renderRadius(t); renderElevation(t); renderMotion(t); renderBorder(t); });
  Array.prototype.forEach.call(document.querySelectorAll('.language-switch button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === CURRENT); });
}
document.querySelector('.language-switch').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  CURRENT = b.getAttribute('data-lang'); renderAll();
});
document.addEventListener('click', function(e){
  /* 关掉浮层：点遮罩 / 点通知本身 */
  var close = e.target.closest('[data-close]');
  if (close){ var cs = close.closest('.stage'); if (cs) cs.classList.remove('open','on'); return; }
  /* 页内动作按钮（抽屉/弹窗/通知/列表/流式） */
  var act = e.target.closest('[data-act]');
  if (act){ var ast = act.closest('.stage'); if (!ast) return;
    runAction(ast.id.indexOf('dark') !== -1 ? 'dark' : 'light', act.getAttribute('data-act')); return; }
  /* 场景自身的真实控件 */
  var node = e.target.closest('.s-dropdown .trg, .s-collapse .p, .s-fade .sw, .s-panel .hdr');
  if (node){ var st = node.closest('.stage');
    if (node.classList.contains('trg')) st.classList.toggle('open');
    else if (node.classList.contains('sw')) st.classList.toggle('on');
    else if (node.classList.contains('hdr')) st.classList.toggle('open');
    else st.classList.toggle('collapsed');
    return; }
});
window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function(){ applyPrefs();
  ['light','dark'].forEach(function(t){ var el = document.getElementById('rm-'+t);
    if (el) el.textContent = rmOn() ? tr('f.motion.reducedOn') : tr('f.motion.reducedOff'); });
});
/* 偏好预览开关：切换后重新渲染，让读数/预览都反映新状态 */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-pref][data-level]'); if (!b) return;
  var k = b.getAttribute('data-pref'), lv = b.getAttribute('data-level');
  if (k === 'motion'){ PREF.motion = lv; var s1 = document.getElementById('stage-light-stream'); if (s1) s1.classList.remove('typing'); }
  if (k === 'contrast'){ PREF.contrast = lv; }
  renderAll();
});
renderAll();
</script>
