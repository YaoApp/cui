<!doctype html>
<html lang="en" class="celadon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yao Agents · Sign in</title>
<link rel="stylesheet" href="../tokens.css">
<script src="../i18n/bundle.js"></script>
<!--
  入口页（login 状态）· 静态设计稿 = 产品形态。默认语言为英文，默认文案：
    Sign up or sign in to your Yao Agents account

  版式照参照图：一张卡片居中；卡内依次为标题 · 第三方（Google / GitHub / Apple，真品牌图标）· OR 分隔 ·
  **单个输入框**（无 label，说明写在 placeholder 里）· 协议勾选 · 近黑反白主按钮 · 卡下引导；
  右上角是语言与主题：语言文字 + 分隔线 + 主题图标，**点开都是菜单**（主题：Auto / Light / Dark）。

  · 主题与语言是**能用**的（这一段是本页唯一的脚本），其余纯静态。
  · 品牌图标取真图标集雪碧图：../icons/brand-sprite-6.svg（Google · GitHub）· ../icons/brand-sprite-2.svg（Apple）。
    输入框前导图标内联自 icons.html 的 `i-nav-user`（界面图标目前只有内联雪碧图，没有独立文件）。
  · 颜色 / 间距 / 字号 / 圆角 / 描边 / 阴影一律取 token（见 ../AGENTS.md）。
-->
<style>
* { box-sizing: border-box; }
html, body { block-size: 100%; }
body {
  margin: 0;
  font-family: var(--font-family-ui);
  font-size: var(--font-size-body);
  line-height: var(--line-height-cjk);
  color: var(--text-primary);
  background: var(--background-app);
  -webkit-font-smoothing: antialiased;
}
:root { --auth-card: 480px; --brand-mark: 32px; }   /* 局部：卡片宽度 · 标记尺寸；进产品时归 token */

.page { min-block-size: 100%; display: flex; flex-direction: column; padding: var(--spacing-16) var(--spacing-24); }

/* hidden 必须真的隐藏：下面的 .error-line 用了 display:flex，会盖掉浏览器给 [hidden] 的 display:none */
[hidden] { display: none !important; }

/* 顶行：左 LOGO；右语言与主题（照参照图：文字 + 分隔线 + 图标，点开是菜单） */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-16); position: relative; }
.brand { display: flex; align-items: center; gap: var(--spacing-8); }
.brand__mark { inline-size: var(--brand-mark); block-size: auto; display: block; }
/* 产品名：大号 + **例外**的品牌渐变（体系里唯一允许渐变文字的地方，用标记自身的渐变 token；
   浅暗同版，与 logo-mark-celadon.svg 的渐变一致）。 */
.brand__name { font-size: var(--font-size-20); font-weight: var(--font-weight-strong); letter-spacing: var(--letter-spacing-latin);
               background: linear-gradient(105deg, var(--brand-mark-from) 0%, var(--brand-mark-to) 100%);
               -webkit-background-clip: text; background-clip: text; color: transparent; }
.ctrl { display: flex; align-items: center; gap: var(--spacing-8); }
.ctrl__sep { inline-size: var(--border-width); block-size: var(--spacing-16); background: var(--border-default); }
.ctrl__btn { display: inline-flex; align-items: center; gap: var(--spacing-8); border: 0; background: transparent;
             color: var(--text-secondary); font: inherit; font-size: var(--font-size-13); cursor: pointer;
             padding: var(--spacing-4) var(--spacing-8); border-radius: var(--radius-small); }
.ctrl__btn:hover { background: var(--background-hover); color: var(--text-primary); }
.ctrl__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.ctrl__btn .icon { inline-size: 16px; block-size: 16px; display: block; }

/* 菜单：浮层（token 的层级/圆角/阴影） */
.menu { position: absolute; inset-block-start: calc(100% + var(--spacing-4)); inset-inline-end: 0;
        min-inline-size: 176px; padding: var(--spacing-4); z-index: var(--z-overlay);
        background: var(--background-surface); border: var(--border-width) solid var(--border-default);
        border-radius: var(--radius-large); box-shadow: var(--shadow-overlay); }
.menu[hidden] { display: none; }
.menu button { display: flex; align-items: center; gap: var(--spacing-8); inline-size: 100%; text-align: start;
               border: 0; background: transparent; color: var(--text-primary); font: inherit;
               font-size: var(--font-size-body); cursor: pointer; padding: var(--spacing-8) var(--spacing-8);
               border-radius: var(--radius-small); }
.menu button:hover { background: var(--background-hover); }
.menu button.is-on { background: var(--background-selected); }
.menu button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.menu .icon { inline-size: 16px; block-size: 16px; display: block; flex: none; color: var(--text-secondary); }

/* 卡片 */
.stage { flex: 1; display: grid; place-items: center; align-content: center; padding-block: var(--spacing-32); }
.card { position: relative; inline-size: min(100%, var(--auth-card)); padding: var(--spacing-32) var(--spacing-24) var(--spacing-32);
        background: var(--background-content); border: var(--border-width) solid var(--border-subtle);
        border-radius: var(--radius-large); box-shadow: var(--shadow-subtle); }
/* 标题两行：每行一个块；字号用新加的 24 档 */
.title { margin: 0 0 var(--spacing-32); font-size: var(--font-size-28); font-weight: var(--font-weight-strong); line-height: var(--line-height-normal); }
.title__line { display: block; }
.title__line:empty { display: none; }   /* 某些语言标题不换行：空行收起 */

/* 第三方：整宽、软底、左图标 + 居中文字 */
.providers { display: grid; gap: var(--spacing-8); margin-block-end: var(--spacing-24); }
.provider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--spacing-8);
            min-block-size: var(--row-height); padding-inline: var(--spacing-12);
            background: var(--background-field); color: var(--text-primary);
            border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-medium);
            font: inherit; font-size: var(--font-size-14); font-weight: var(--font-weight-medium); cursor: pointer; }
.provider:hover { background: var(--background-hover); }
.provider:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.provider__label { text-align: center; }
.provider__mark { inline-size: 18px; block-size: 18px; display: block; }

.or { display: flex; align-items: center; gap: var(--spacing-12); margin: 0 0 var(--spacing-24);
      color: var(--text-tertiary); font-size: var(--font-size-11); letter-spacing: var(--letter-spacing-latin); }
.or::before, .or::after { content: ''; flex: 1; block-size: var(--border-width); background: var(--border-subtle); }

/* 单输入框：无 label，说明在 placeholder；前导图标住在框内 */
.field { position: relative; display: flex; align-items: center; margin-block-end: var(--spacing-16); }
.field__icon { position: absolute; inset-inline-start: var(--spacing-12); inline-size: var(--spacing-16); block-size: var(--spacing-16);
               display: block; color: var(--text-placeholder); pointer-events: none; }
/* 输入框：**有意弱化**边界（--border-control-low，对外独立页追求轻观感），按规范豁免处理；
   合规档（WCAG 1.4.11 ≥3:1）是 --border-control-strong，默认档是 --border-control。 */
.field .input { inline-size: 100%; min-block-size: var(--row-height); border-radius: var(--radius-medium);
                padding-inline-start: var(--spacing-32); font-size: var(--font-size-14);
                border-color: var(--border-control-low); }

/* 协议 */
.terms { display: flex; gap: var(--spacing-8); align-items: flex-start; margin-block: 0 var(--spacing-16);
         font-size: var(--font-size-13); color: var(--text-secondary); }
/* 复选框：原生控件的未选中边框无法改，故用 appearance:none 自己画（边框走 low 档，与输入框同一档）。
   产品实现时这里应是一个基础件 Checkbox（设计体系暂无该类）。 */
.terms input[type='checkbox'] { appearance: none; -webkit-appearance: none;
  inline-size: var(--spacing-16); block-size: var(--spacing-16); margin-block-start: 2px; flex: none;
  border: var(--border-width) solid var(--border-control-low); border-radius: var(--radius-xs);
  background: var(--background-surface); cursor: pointer; }
.terms input[type='checkbox']:checked { background: var(--brand); border-color: var(--brand); }
.terms input[type='checkbox']:checked::after { content: ''; display: block; inline-size: 4px; block-size: 8px;
  margin: 1px auto 0; border: solid var(--background-surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.terms input[type='checkbox']:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.terms a { color: var(--brand-ink); }

/* 主按钮：近黑反白（照参照图） */
.button { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-8);
          white-space: nowrap; cursor: pointer; font-family: var(--font-family-ui);
          font-weight: var(--font-weight-medium); line-height: var(--line-height-cjk); border-radius: var(--radius-medium);
          border: var(--border-width) solid transparent; }
.button--block { inline-size: 100%; min-block-size: var(--row-height); padding-inline: var(--spacing-16); font-size: var(--font-size-14); }
.button--inverse { background: var(--text-primary); color: var(--background-content); }
.button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
/* 禁用态：一眼看得出不可点（底色/字色/描边都走禁用档，光标 not-allowed） */
.button--inverse:disabled { background: var(--background-disabled); color: var(--text-disabled);
                            border-color: var(--border-disabled); cursor: not-allowed; }
/* 主按钮内部：横向居中的 inline-flex，便于放加载环 */
.button--block { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-8); }
/* 加载动画：按钮内的旋转环（纯 CSS，不引图片） */
.button.is-loading::before { content: ''; inline-size: 14px; block-size: 14px; flex: none;
  border: 2px solid currentColor; border-block-start-color: transparent; border-radius: 50%;
  animation: button-spin 0.7s linear infinite; }
@keyframes button-spin { to { transform: rotate(360deg); } }

/* 错误态：出错的控件自己变色（输入框边界→危险色；复选框边界→危险色、标签→危险文字色），
   错误行紧贴控件下方：小图标 + 危险色文字，左对齐。 */
.field .input.is-error { border-color: var(--danger); }
.field.is-error .field__label { color: var(--danger-ink); }
.terms.is-error input[type='checkbox'] { border-color: var(--danger); }
.terms.is-error label { color: var(--danger-ink); }
.error-line { display: flex; align-items: flex-start; gap: var(--spacing-4); margin: var(--spacing-4) 0 var(--spacing-12);
              color: var(--danger-ink); font-size: var(--font-size-13); text-align: start; }
.error-line .icon { inline-size: var(--spacing-16); block-size: var(--spacing-16); flex: none; margin-block-start: 2px; }
:lang(zh-CN) .error-line, :lang(zh-TW) .error-line, :lang(ja) .error-line { font-size: var(--font-size-minimum-cjk); }

.footnote { margin: var(--spacing-16) 0 0; text-align: center; font-size: var(--font-size-13); color: var(--text-secondary); }

/* 简繁日的最小字号：设计体系规定中文最小 12（--font-size-minimum-cjk），11 档只给拉丁/数字 */
:lang(zh-CN) .or, :lang(zh-TW) .or, :lang(ja) .or,
:lang(zh-CN) .footnote, :lang(zh-TW) .footnote, :lang(ja) .footnote,
:lang(zh-CN) .bottom, :lang(zh-TW) .bottom, :lang(ja) .bottom { font-size: var(--font-size-minimum-cjk); }

/* 底行：条款 */
.bottom { display: flex; justify-content: center; align-items: center; gap: var(--spacing-8); color: var(--text-tertiary); font-size: var(--font-size-11); }
.bottom a { color: var(--text-tertiary); }
/* 客户端内模式（?from=connect）：不展示品牌区与服务协议，控件与服务器选择页同位置（卡片下方居中） */
body.is-client .brand { display: none; }
body.is-client .terms { display: none; }
body.is-client .bottom { display: none; }   /* 页脚条款同样不展示 */
body.is-client .ctrl-wrap { margin-block-start: var(--spacing-24); }
body.is-client .ctrl-wrap { position: relative; }
/* 客户端内菜单向上展开、按内容收窄、水平居中（与服务器选择页一致） */
body.is-client .menu { inset-block-start: auto; inset-block-end: calc(100% + var(--spacing-4));
                       inset-inline-start: 50%; inset-inline-end: auto; transform: translateX(-50%);
                       inline-size: max-content; min-inline-size: 160px; }
body.is-client .ctrl { justify-content: center; }   /* 与服务器选择页一致：卡片下方居中 */
body.is-client .menu { inset-block-end: calc(100% + var(--spacing-4)); inset-inline-start: 50%; transform: translateX(-50%); }
/* 客户端内：卡片顶部的「返回服务器选择」与当前服务器（静态展示） */
/* 客户端内：横条与卡片同属一个区域，间距由容器的 gap 决定 */
.client-stack { display: grid; gap: var(--spacing-12); inline-size: min(100%, var(--auth-card)); }
.client-bar { display: none; align-items: center; justify-content: space-between; gap: var(--spacing-8); }
body.is-client .client-bar { display: flex; }
.client-back { display: inline-flex; align-items: center; gap: var(--spacing-4); color: var(--text-primary);
               font-size: var(--font-size-13); text-decoration: none; }
.client-back:hover { color: var(--brand-ink); }
.client-back .icon { inline-size: var(--spacing-16); block-size: var(--spacing-16); }
/* 当前服务器：角标形态（带底色的胶囊），文字用最深一档，比纯文本醒目 */
/* 当前服务器：与返回入口同一行，右侧，仅加粗文字 */
.client-server { display: inline-flex; align-items: center; gap: var(--spacing-4); margin-inline-start: auto;
                 margin-inline-end: var(--spacing-12);   /* 右端略向内收 */
                 color: var(--text-primary); font-size: var(--font-size-13); font-weight: var(--font-weight-strong);
                 min-inline-size: 0; }
.client-server__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--font-weight-medium); }
:lang(zh-CN) .client-back, :lang(zh-TW) .client-back, :lang(ja) .client-back,
:lang(zh-CN) .client-server, :lang(zh-TW) .client-server, :lang(ja) .client-server { font-size: var(--font-size-minimum-cjk); }
</style>
</head>
<body>
<!-- 界面图标：目前只有 icons.html 里的内联雪碧图，没有独立文件；这里内联本次用到的一个符号 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-state-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-pc" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" x2="16" y1="21" y2="21" stroke="currentColor" stroke-width="2"/><line x1="12" x2="12" y1="17" y2="21" stroke="currentColor" stroke-width="2"/></symbol>
</defs></svg>

<div class="page">

  <header class="top">
    <span class="brand">
      <img class="brand__mark" src="../logo-mark-celadon.svg" alt="" width="32" height="27">
      <span class="brand__name">Yao Agents</span>
    </span>

    <span class="ctrl">
      <button class="ctrl__btn" type="button" id="lang-btn" aria-haspopup="menu" aria-expanded="false">
        <span id="lang-label">English</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-globe"></use></svg>
      </button>
      <span class="ctrl__sep" aria-hidden="true"></span>
      <button class="ctrl__btn" type="button" id="theme-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Theme">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use id="theme-icon" href="#i-sun"></use></svg>
      </button>
    </span>

    <div class="menu" id="lang-menu" role="menu" hidden>
      <button type="button" role="menuitemradio" data-lang="system">跟随系统（中文）</button>
      <button type="button" role="menuitemradio" data-lang="zh-CN">简体中文</button>
      <button type="button" role="menuitemradio" data-lang="zh-TW">繁體中文</button>
      <button type="button" role="menuitemradio" data-lang="en">English</button>
      <button type="button" role="menuitemradio" data-lang="ja">日本語</button>
    </div>
  </header>

  <div class="stage">
    <div class="client-bar" id="client-bar">
        <a class="client-back" href="./servers.html">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          <span data-i18n="backToServers">Back to servers</span>
        </a>
        <span class="client-server">
          <span class="client-server__name" id="client-server-name"></span>
        </span>
      </div>
    <main class="card" aria-labelledby="auth-title">
      <h1 class="title" id="auth-title">
        <span class="title__line" data-i18n="entryTitle">Sign up or sign in to your</span>
        <span class="title__line" data-i18n="entryTitleLine2">Yao Agents account</span>
      </h1>

      <div class="providers">
        <button class="provider" type="button">
          <svg class="provider__mark" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons/brand-sprite-6.svg#brand-google"></use></svg>
          <span class="provider__label" data-i18n="providerGoogle">Continue with Google</span>
          <span aria-hidden="true"></span>
        </button>
        <button class="provider" type="button">
          <svg class="provider__mark" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons/brand-sprite-6.svg#brand-github"></use></svg>
          <span class="provider__label" data-i18n="providerGitHub">Continue with GitHub</span>
          <span aria-hidden="true"></span>
        </button>
        <button class="provider" type="button">
          <svg class="provider__mark" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons/brand-sprite-2.svg#brand-apple"></use></svg>
          <span class="provider__label" data-i18n="providerApple">Continue with Apple</span>
          <span aria-hidden="true"></span>
        </button>
      </div>

      <p class="or" data-i18n="or">OR</p>

      <form novalidate>
        <div class="field" id="account-field">
          <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mail"></use></svg>
          <input class="input" id="account" name="account" type="email" autocomplete="email"
                 inputmode="email" autocapitalize="off" spellcheck="false" data-i18n-ph="accountPh" placeholder="Enter your email">
        </div>

        <p class="error-line" id="terms-error" role="alert" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-state-error"></use></svg>
          <span data-i18n="errTerms">Please read and agree to the terms first.</span>
        </p>

        <button class="button button--block button--inverse" type="submit" id="next" data-i18n="next">Next</button>
      </form>

      <p class="footnote"><span data-i18n="noAccount">Don&apos;t have an account?</span> <a class="link" href="./register.html" data-i18n="signUpNow">Sign up now</a></p>
    </main>
  </div>

  <footer class="bottom">
    <a class="link" href="#" data-i18n="termsService">Terms of Service</a>
    <span>·</span>
    <a class="link" href="#" data-i18n="termsPrivacy">Privacy Policy</a>
  </footer>

</div>

<script>
/* 本页唯一的脚本：主题与语言。（产品的这两处在平台层，这里只为把设计做成"能用"。） */
const dictOf = (lang) => (((window.CELADON_I18N || {})[lang === 'system' ? 'zh-CN' : lang] || {}).ui || {}).entry || {}
let lang = 'en'
let theme = 'auto'

function applyLang(next) {
  lang = next
  const langKey = lang === 'system' ? 'zh-CN' : lang
  const dict = dictOf(lang)
  document.documentElement.lang = langKey
  /* 值为空串也要写进去：某些语言的标题不换行，第二行必须被清空 */
  document.querySelectorAll('[data-i18n]').forEach((el) => { const v = dict[el.dataset.i18n]; if (v !== undefined) el.textContent = v })
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { const v = dict[el.dataset.i18nPh]; if (v) el.placeholder = v })
  if (typeof renderClientBar === 'function') renderClientBar()   /* 名称跟随语言 */
  document.getElementById('lang-label').textContent = { system: '跟随系统（中文）', 'zh-CN': '简体中文', 'zh-TW': '繁體中文', en: 'English', ja: '日本語' }[lang]
  document.querySelectorAll('#lang-menu [data-lang]').forEach((b) => b.classList.toggle('is-on', b.dataset.lang === lang))
}

function applyTheme(next) {
  theme = next === 'dark' ? 'dark' : 'light'      /* 菜单只有 Light / Dark 两项；首屏默认跟随系统 */
  document.documentElement.dataset.theme = theme
  document.getElementById('theme-icon').setAttribute('href', theme === 'dark' ? '#i-moon' : '#i-sun')
}

function toggleMenu(id, open) {
  const menu = document.getElementById(id)
  const button = document.getElementById(id === 'lang-menu' ? 'lang-btn' : 'theme-btn')
  const next = open ?? menu.hidden
  menu.hidden = !next
  button.setAttribute('aria-expanded', String(next))
  if (next) menu.querySelector('button')?.focus()
}

document.getElementById('lang-btn').addEventListener('click', () => toggleMenu('lang-menu'))
document.getElementById('theme-btn').addEventListener('click', (e) => {
  e.stopPropagation(); applyTheme(theme === 'dark' ? 'light' : 'dark')
})
document.querySelectorAll('#lang-menu [data-lang]').forEach((b) => b.addEventListener('click', () => { applyLang(b.dataset.lang); toggleMenu('lang-menu', false) }))
document.addEventListener('click', (event) => {
  if (!event.target.closest('.ctrl, .menu')) { toggleMenu('lang-menu', false) }
})
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') { toggleMenu('lang-menu', false) }
})


/* 未填邮箱：Next 禁用；提交：校验邮箱后假加载 2–3 秒进下一步（同意条款属于注册行为，这一步不问） */
const nextBtn = document.getElementById('next')
const emailInput = document.getElementById('account')
const accountField = document.getElementById('account-field')
const emailError = document.createElement('p')
emailError.className = 'error-line'
emailError.hidden = true
emailError.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-state-error"></use></svg><span></span>'
accountField.after(emailError)   /* 放在字段之后：字段自身仍是原来的形状，图标不会被挤歪 */
const errorText = (key) => { emailError.querySelector('span').textContent = dictOf(lang)[key] || key }

emailInput.addEventListener('input', () => {
  emailInput.classList.remove('is-error')
  accountField.classList.remove('is-error')
  emailError.hidden = true
})
document.querySelector('form').addEventListener('submit', async (event) => {
  event.preventDefault()
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailInput.value.trim())) {
    emailInput.classList.add('is-error')
    accountField.classList.add('is-error')
    errorText('errEmail')
    emailError.hidden = false
    emailInput.focus()
    return
  }
  nextBtn.classList.add('is-loading')     /* 只有 checking 期间不可点 */
  nextBtn.disabled = true
  nextBtn.textContent = dictOf(lang).nextBusy || 'Checking…'
  await new Promise((resolve) => setTimeout(resolve, 2400))
  location.href = isClient ? './register.html?from=connect' : './register.html'
})
/* 客户端内模式：从 Connect 跳来（?from=connect）——收起品牌区与协议，控件移到卡片下方 */
/* 客户端内（?from=connect）：角标 + 返回入口 + 控件；独立页一律不生效 */
const isClient = new URLSearchParams(location.search).has('from')

if (isClient) {
  document.body.classList.add('is-client')
  const card = document.querySelector('.card')
  const bar = document.getElementById('client-bar')
  const tag = document.querySelector('.client-server')

  if (card && bar && tag) {
    const stack = document.createElement('div')          /* 横条与卡片同一区域 */
    stack.className = 'client-stack'
    card.before(stack)
    stack.append(bar)
    stack.append(card)
  }

  const ctrl = document.querySelector('.ctrl')
  const langMenu = document.getElementById('lang-menu')
  const anchor = document.querySelector('.client-stack') || card
  if (ctrl && anchor) {
    const wrap = document.createElement('div')           /* 控件独立容器：卡下 24、居中 */
    wrap.className = 'ctrl-wrap'
    ctrl.replaceWith(wrap)
    wrap.append(ctrl)
    if (langMenu) wrap.append(langMenu)
    anchor.after(wrap)
  }

  const signUp = document.querySelector('a[href="./register.html"]')
  if (signUp) signUp.setAttribute('href', './register.html?from=connect')
}

/* 角标里的名称：走语言包，跟随语言切换 */
function renderClientBar() {
  if (!isClient) return
  const nameEl = document.getElementById('client-server-name')
  if (!nameEl) return
  const key = new URLSearchParams(location.search).get('server') || 'serverApac'
  const dict = dictOf(lang)
  nameEl.textContent = key === 'custom' ? dict.customOption : (dict[key] || dict.serverApac)
}

applyLang('en')
/* 首屏：跟随系统（head 里那一行已设好 data-theme），图标与选中态据此初始化 */
applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light')
</script>
</body>
</html>
