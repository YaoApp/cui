<!doctype html>
<html lang="zh-CN" class="celadon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celadon · 登录</title>
<link rel="stylesheet" href="../tokens.css">
<script>if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"</script>
<!--
  登录界面（login 状态）· 静态设计稿，与产品同构：类名、文案来源、尺寸档都照产品来。

  版式照 LobeHub 的登录页（用户给的参照图）：一张**卡片**居中，卡内自左向右排 —— 标题（两行、加粗、左对齐）
  → 第三方按钮（整宽、软底、左图标 + 居中文字）→「OR」分隔 → 输入框 → 主按钮（近黑反白）→ 卡下一行引导；
  语言与主题放**右上角**，条款放右下角。

  · 第三方品牌图标用真图标集的雪碧图文件：../icons/brand-sprite-6.svg（Google · GitHub）· ../icons/brand-sprite-2.svg（Apple）。
  · 不含交互脚本（只放设计体系那句"跟随系统"的一行）；主按钮为局部类 `.button--inverse`（近黑反白，照参照图）。
  · 文案取自 design/i18n/*.json 的 ui.entry.*；LOGO 用正版标记 ../logo-mark-celadon.svg。
  · 颜色 / 间距 / 字号 / 圆角 / 描边 / 阴影一律取 token（见 ../AGENTS.md）。
-->
<style>
* { box-sizing: border-box; }
html, body { block-size: 100%; }
body {
  margin: 0;
  font-family: var(--font-family-ui);
  font-size: var(--font-size-body);
  line-height: var(--line-height-cjk);
  color: var(--text-primary);
  background: var(--background-app);
  -webkit-font-smoothing: antialiased;
}
:root { --auth-card: 512px; }   /* 局部：卡片宽度；进产品时归 token */

.page { min-block-size: 100%; display: flex; flex-direction: column; padding: var(--spacing-16) var(--spacing-24) var(--spacing-16); }

/* 顶行：左 LOGO，右语言与主题 */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-16); }
.brand { display: flex; align-items: center; gap: var(--spacing-8); }
.brand__mark { inline-size: 26px; block-size: auto; display: block; }
.brand__name { font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--text-secondary); letter-spacing: var(--letter-spacing-latin); }
.tools { display: flex; align-items: center; gap: var(--spacing-8); }
.tools select.input { inline-size: auto; min-block-size: var(--spacing-32); padding-block: 0; font-size: var(--font-size-caption); }

/* 卡片：整卡居中 */
.stage { flex: 1; display: grid; place-items: center; padding-block: var(--spacing-32); }
.card {
  inline-size: min(100%, var(--auth-card));
  padding: var(--spacing-48) var(--spacing-48) var(--spacing-32);
  background: var(--background-content);
  border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-large);
  box-shadow: var(--shadow-subtle);
}
.title { margin: 0 0 var(--spacing-32); font-size: var(--font-size-20); font-weight: var(--font-weight-strong); line-height: 1.25; }

/* 第三方：整宽、软底、左图标 + 居中文字（照参照图） */
.providers { display: grid; gap: var(--spacing-8); margin-block-end: var(--spacing-24); }
.provider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--spacing-8);
            min-block-size: var(--row-height); padding-inline: var(--spacing-12);
            background: var(--background-field); color: var(--text-primary);
            border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-medium);
            font: inherit; font-size: var(--font-size-body); cursor: pointer; }
.provider:hover { background: var(--background-hover); }
.provider:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.provider__label { text-align: center; }
.provider__mark { inline-size: 18px; block-size: 18px; display: block; }

/* 「OR」分隔 */
.or { display: flex; align-items: center; gap: var(--spacing-12); margin: 0 0 var(--spacing-24);
      color: var(--text-tertiary); font-size: var(--font-size-11); letter-spacing: var(--letter-spacing-latin); }
.or::before, .or::after { content: ''; flex: 1; block-size: var(--border-width); background: var(--border-subtle); }

/* 字段 */
.field { margin-block-end: var(--spacing-16); }
.field__label { display: block; margin-block-end: var(--spacing-4); font-size: var(--font-size-label); font-weight: var(--font-weight-medium); color: var(--text-secondary); }
.field__control { position: relative; display: flex; align-items: center; }
.field__control .input { inline-size: 100%; min-block-size: var(--row-height); border-radius: var(--radius-medium); }
.field__control--trail .input { padding-inline-end: var(--spacing-48); }
.field__trail { position: absolute; inset-inline-end: var(--spacing-4); border: 0; background: transparent; cursor: pointer;
                color: var(--text-tertiary); font: inherit; font-size: var(--font-size-caption);
                padding: var(--spacing-4) var(--spacing-8); border-radius: var(--radius-xs); }
.field__trail:hover { color: var(--text-secondary); }
.field__trail:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.row { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8); margin-block: 0 var(--spacing-24); }
.check { display: inline-flex; align-items: center; gap: var(--spacing-8); font-size: var(--font-size-caption); color: var(--text-secondary); }
.check input { inline-size: 16px; block-size: 16px; accent-color: var(--brand); }

/* 主按钮：布局与尺寸档照产品 `components/base/button`；配色照参照图为近黑反白（局部类，产品若采用则进设计类） */
.button { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-8);
          white-space: nowrap; cursor: pointer; font-family: var(--font-family-ui);
          font-weight: var(--font-weight-medium); line-height: var(--line-height-cjk); border-radius: var(--radius-medium);
          border: var(--border-width) solid transparent; }
.button--block { inline-size: 100%; min-block-size: var(--row-height); padding-inline: var(--spacing-16); font-size: var(--font-size-body); }
.button--inverse { background: var(--text-primary); color: var(--background-content); }
.button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.footnote { margin: var(--spacing-16) 0 0; text-align: center; font-size: var(--font-size-caption); color: var(--text-secondary); }

/* 底行：条款 */
.bottom { display: flex; justify-content: flex-end; align-items: center; gap: var(--spacing-8); color: var(--text-tertiary); font-size: var(--font-size-11); }
.bottom a { color: var(--text-tertiary); }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <span class="brand">
      <img class="brand__mark" src="../logo-mark-celadon.svg" alt="" width="26" height="22">
      <span class="brand__name">Yao Agents</span>
    </span>
    <span class="tools">
      <select class="input" aria-label="语言">
        <option selected>跟随系统（中文）</option>
        <option>简体中文</option>
        <option>繁體中文</option>
        <option>English</option>
        <option>日本語</option>
      </select>
      <span class="seg theme-toggle" role="group" aria-label="主题">
        <button type="button" class="is-on" aria-pressed="true">浅色</button>
        <button type="button" aria-pressed="false">暗色</button>
      </span>
    </span>
  </header>

  <div class="stage">
    <main class="card" aria-labelledby="auth-title">
      <h1 class="title" id="auth-title">登录<br>Yao Agents 账号</h1>

      <!-- 第三方：名单由入口配置（/user/entry）决定；图标来自真图标集的雪碧图 -->
      <div class="providers">
        <button class="provider" type="button">
          <svg class="provider__mark" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons/brand-sprite-6.svg#brand-google"></use></svg>
          <span class="provider__label">使用 Google 继续</span>
          <span aria-hidden="true"></span>
        </button>
        <button class="provider" type="button">
          <svg class="provider__mark" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons/brand-sprite-6.svg#brand-github"></use></svg>
          <span class="provider__label">使用 GitHub 继续</span>
          <span aria-hidden="true"></span>
        </button>
        <button class="provider" type="button">
          <svg class="provider__mark" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons/brand-sprite-2.svg#brand-apple"></use></svg>
          <span class="provider__label">使用 Apple 继续</span>
          <span aria-hidden="true"></span>
        </button>
      </div>

      <p class="or">或</p>

      <form>
        <div class="field">
          <label class="field__label" for="account">账号</label>
          <div class="field__control">
            <input class="input" id="account" name="account" type="text" autocomplete="username"
                   inputmode="email" autocapitalize="off" spellcheck="false" placeholder="邮箱或手机号">
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="password">密码</label>
          <div class="field__control field__control--trail">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            <button class="field__trail" type="button">显示</button>
          </div>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" checked>记住我</label>
        </div>

        <button class="button button--block button--inverse" type="submit">登录</button>
      </form>

      <p class="footnote">还没有账号？<a class="link" href="./register.html">创建账号</a></p>
    </main>
  </div>

  <footer class="bottom">
    <a class="link" href="#">服务条款</a>
    <span>·</span>
    <a class="link" href="#">隐私政策</a>
  </footer>

</div>
</body>
</html>
