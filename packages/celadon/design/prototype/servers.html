<!doctype html>
<html lang="en" class="celadon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yao Agents · Choose a server</title>
<link rel="stylesheet" href="../tokens.css">
<script src="../i18n/bundle.js"></script>
<!--
  入口页（login 状态）· 静态设计稿 = 产品形态。默认语言为英文，默认文案：
    Sign up or sign in to your Yao Agents account

  版式照参照图：一张卡片居中；卡内依次为标题 · 第三方（Google / GitHub / Apple，真品牌图标）· OR 分隔 ·
  **单个输入框**（无 label，说明写在 placeholder 里）· 协议勾选 · 近黑反白主按钮 · 卡下引导；
  右上角是语言与主题：语言文字 + 分隔线 + 主题图标，**点开都是菜单**（主题：Auto / Light / Dark）。

  · 主题与语言是**能用**的（这一段是本页唯一的脚本），其余纯静态。
  · 品牌图标取真图标集雪碧图：../icons/brand-sprite-6.svg（Google · GitHub）· ../icons/brand-sprite-2.svg（Apple）。
    输入框前导图标内联自 icons.html 的 `i-nav-user`（界面图标目前只有内联雪碧图，没有独立文件）。
  · 颜色 / 间距 / 字号 / 圆角 / 描边 / 阴影一律取 token（见 ../AGENTS.md）。
-->
<style>
* { box-sizing: border-box; }
html, body { block-size: 100%; }
body {
  margin: 0;
  font-family: var(--font-family-ui);
  font-size: var(--font-size-body);
  line-height: var(--line-height-cjk);
  color: var(--text-primary);
  background: var(--background-app);
  -webkit-font-smoothing: antialiased;
}
:root { --auth-card: 480px; --brand-mark: 32px; }   /* 局部：卡片宽度 · 标记尺寸；进产品时归 token */

.page { min-block-size: 100%; display: flex; flex-direction: column; padding: var(--spacing-16) var(--spacing-24); }

/* hidden 必须真的隐藏：下面的 .error-line 用了 display:flex，会盖掉浏览器给 [hidden] 的 display:none */
[hidden] { display: none !important; }

/* 服务器选择页：卡内为 标题 · 副标题 · 两个页签 · 选择器 / 地址 · 连接 · 邀请 */
.sub { margin: 0 0 var(--spacing-24); color: var(--text-secondary); font-size: var(--font-size-14); text-align: start; }
.sub--hint { margin: var(--spacing-8) 0 var(--spacing-16); font-size: var(--font-size-13); color: var(--text-tertiary); }
:lang(zh-CN) .sub--hint, :lang(zh-TW) .sub--hint, :lang(ja) .sub--hint { font-size: var(--font-size-minimum-cjk); }
.picker-wrap { margin-block-end: var(--spacing-16); }
.spinner { inline-size: var(--spacing-16); block-size: var(--spacing-16); flex: none; border: 2px solid var(--border-strong);
           border-block-start-color: transparent; border-radius: 50%; animation: button-spin 0.7s linear infinite; }
.picker { inline-size: 100%; min-block-size: 56px; display: flex; align-items: center; gap: var(--spacing-8);
          padding: var(--spacing-8) var(--spacing-12); text-align: start; cursor: pointer;
          border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-medium);
          background: var(--background-field); color: var(--text-primary); font: inherit; }
.picker:hover { border-color: var(--border-strong); }
.picker:focus-visible { outline: none; box-shadow: var(--focus-ring); }
/* 加载 / 空：与选择器同一只盒子，只是内容换成转圈与文字（不再盒中盒） */
.picker--state { display: flex; align-items: center; gap: var(--spacing-8); cursor: default;
                 color: var(--text-secondary); font-size: var(--font-size-14); margin-block-end: var(--spacing-16); }
.picker--state:focus-visible { box-shadow: none; }
/* 自建：选中后才出现地址输入，与选择器、按钮各留一段间距 */
.field--reveal { margin-block: 0 var(--spacing-4); }
.sub--hint { margin: var(--spacing-4) 0 var(--spacing-16); }
.picker__meta { display: flex; flex-direction: column; gap: 2px; flex: 1; min-inline-size: 0; }
.opt__logo { inline-size: calc(var(--spacing-16) + var(--spacing-4)); block-size: calc(var(--spacing-16) + var(--spacing-4)); flex: none; object-fit: contain; }
svg.opt__logo { color: var(--text-tertiary); }
.picker__name { font-size: var(--font-size-15); font-weight: var(--font-weight-medium); }
.picker__name.placeholder { color: var(--text-placeholder); font-weight: var(--font-weight-normal); }
.picker__url { color: var(--text-tertiary); font-size: var(--font-size-13); overflow-wrap: anywhere; }
.picker__arrow { inline-size: var(--spacing-16); block-size: var(--spacing-16); flex: none; color: var(--text-tertiary); }
.picker-wrap { position: relative; }
.picker__list { position: absolute; inset-block-start: calc(100% + var(--spacing-4)); inset-inline: 0; z-index: var(--z-popover);
                padding: var(--spacing-4); background: var(--background-surface); border: var(--border-width) solid var(--border-subtle);
                border-radius: var(--radius-medium); box-shadow: var(--shadow-popover); max-block-size: 264px; overflow: auto; }
.picker__item { display: flex; flex-direction: column; gap: 2px; inline-size: 100%; padding: var(--spacing-8) var(--spacing-12);
                text-align: start; border: 0; border-radius: var(--radius-small); background: transparent; cursor: pointer; color: inherit; font: inherit; }
.picker__item:hover { background: var(--background-hover); }
.picker__item.is-on { background: var(--background-selected); }
.picker__item-name { font-size: var(--font-size-15); }
.picker__item-meta { color: var(--text-tertiary); font-size: var(--font-size-13); }
.picker-fail { display: flex; flex-direction: column; gap: var(--spacing-4); align-items: flex-start; }
.invite { margin: var(--spacing-16) 0 0; color: var(--text-tertiary); font-size: var(--font-size-13); text-align: start; }
:lang(zh-CN) .invite, :lang(zh-TW) .invite, :lang(ja) .invite { font-size: var(--font-size-minimum-cjk); }

/* 顶行：左 LOGO；右语言与主题（照参照图：文字 + 分隔线 + 图标，点开是菜单） */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-16); position: relative; }
.brand { display: flex; align-items: center; gap: var(--spacing-8); }
.brand__mark { inline-size: var(--brand-mark); block-size: auto; display: block; }
/* 产品名：大号 + **例外**的品牌渐变（体系里唯一允许渐变文字的地方，用标记自身的渐变 token；
   浅暗同版，与 logo-mark-celadon.svg 的渐变一致）。 */
.brand__name { font-size: var(--font-size-20); font-weight: var(--font-weight-strong); letter-spacing: var(--letter-spacing-latin);
               background: linear-gradient(105deg, var(--brand-mark-from) 0%, var(--brand-mark-to) 100%);
               -webkit-background-clip: text; background-clip: text; color: transparent; }
.ctrl-wrap { position: relative; margin-block-start: var(--spacing-24); }
.ctrl { display: flex; align-items: center; justify-content: center; gap: var(--spacing-8); }
.ctrl__sep { inline-size: var(--border-width); block-size: var(--spacing-16); background: var(--border-default); }
.ctrl__btn { display: inline-flex; align-items: center; gap: var(--spacing-8); border: 0; background: transparent;
             color: var(--text-secondary); font: inherit; font-size: var(--font-size-13); cursor: pointer;
             padding: var(--spacing-4) var(--spacing-8); border-radius: var(--radius-small); }
.ctrl__btn:hover { background: var(--background-hover); color: var(--text-primary); }
.ctrl__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.ctrl__btn .icon { inline-size: 16px; block-size: 16px; display: block; }

/* 菜单：浮层（token 的层级/圆角/阴影） */
.menu { position: absolute; inset-block-end: calc(100% + var(--spacing-4)); inset-inline-start: 50%; transform: translateX(-50%);
        min-inline-size: 176px; padding: var(--spacing-4); z-index: var(--z-base);
        background: var(--background-surface); border: var(--border-width) solid var(--border-default);
        border-radius: var(--radius-large); box-shadow: var(--shadow-overlay); }
.menu[hidden] { display: none; }
.menu button { display: flex; align-items: center; gap: var(--spacing-8); inline-size: 100%; text-align: start;
               border: 0; background: transparent; color: var(--text-primary); font: inherit;
               font-size: var(--font-size-body); cursor: pointer; padding: var(--spacing-8) var(--spacing-8);
               border-radius: var(--radius-small); }
.menu button:hover { background: var(--background-hover); }
.menu button.is-on { background: var(--background-selected); }
.menu button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.menu .icon { inline-size: 16px; block-size: 16px; display: block; flex: none; color: var(--text-secondary); }

/* 卡片 */
.stage { flex: 1; display: grid; place-items: center; padding-block: var(--spacing-32); }
.card { inline-size: min(100%, var(--auth-card)); padding: var(--spacing-32) var(--spacing-24) var(--spacing-32);
        background: var(--background-content); border: var(--border-width) solid var(--border-subtle);
        border-radius: var(--radius-large); box-shadow: var(--shadow-subtle); }
/* 标题两行：每行一个块；字号用新加的 24 档 */
.title { margin: 0 0 var(--spacing-32); font-size: var(--font-size-28); font-weight: var(--font-weight-strong); line-height: var(--line-height-normal); }
.title__line { display: block; }
.title__line:empty { display: none; }   /* 某些语言标题不换行：空行收起 */

/* 第三方：整宽、软底、左图标 + 居中文字 */
.providers { display: grid; gap: var(--spacing-8); margin-block-end: var(--spacing-24); }
.provider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--spacing-8);
            min-block-size: var(--row-height); padding-inline: var(--spacing-12);
            background: var(--background-field); color: var(--text-primary);
            border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-medium);
            font: inherit; font-size: var(--font-size-14); font-weight: var(--font-weight-medium); cursor: pointer; }
.provider:hover { background: var(--background-hover); }
.provider:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.provider__label { text-align: center; }
.provider__mark { inline-size: 18px; block-size: 18px; display: block; }

.or { display: flex; align-items: center; gap: var(--spacing-12); margin: 0 0 var(--spacing-24);
      color: var(--text-tertiary); font-size: var(--font-size-11); letter-spacing: var(--letter-spacing-latin); }
.or::before, .or::after { content: ''; flex: 1; block-size: var(--border-width); background: var(--border-subtle); }

/* 单输入框：无 label，说明在 placeholder；前导图标住在框内 */
.field { position: relative; display: flex; align-items: center; margin-block-end: var(--spacing-16); }
.field__icon { position: absolute; inset-inline-start: var(--spacing-12); inline-size: var(--spacing-16); block-size: var(--spacing-16);
               display: block; color: var(--text-placeholder); pointer-events: none; }
/* 输入框：本页先用**低对比档**边界（--border-control-low，观感轻）；
   合规档（WCAG 1.4.11 ≥3:1）是 --border-control-strong，默认档是 --border-control。 */
.field .input { inline-size: 100%; min-block-size: var(--row-height); border-radius: var(--radius-medium);
                padding-inline-start: var(--spacing-32); font-size: var(--font-size-14);
                border-color: var(--border-control-low); }

/* 协议 */
.terms { display: flex; gap: var(--spacing-8); align-items: flex-start; margin-block: 0 var(--spacing-16);
         font-size: var(--font-size-13); color: var(--text-secondary); }
/* 复选框：原生控件的未选中边框无法改，故用 appearance:none 自己画（边框走 low 档，与输入框同一档）。
   产品实现时这里应是一个基础件 Checkbox（设计体系暂无该类）。 */
.terms input[type='checkbox'] { appearance: none; -webkit-appearance: none;
  inline-size: var(--spacing-16); block-size: var(--spacing-16); margin-block-start: 2px; flex: none;
  border: var(--border-width) solid var(--border-control-low); border-radius: var(--radius-xs);
  background: var(--background-surface); cursor: pointer; }
.terms input[type='checkbox']:checked { background: var(--brand); border-color: var(--brand); }
.terms input[type='checkbox']:checked::after { content: ''; display: block; inline-size: 4px; block-size: 8px;
  margin: 1px auto 0; border: solid var(--background-surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.terms input[type='checkbox']:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.terms a { color: var(--brand-ink); }

/* 主按钮：近黑反白（照参照图） */
.button { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-8);
          white-space: nowrap; cursor: pointer; font-family: var(--font-family-ui);
          font-weight: var(--font-weight-medium); line-height: var(--line-height-cjk); border-radius: var(--radius-medium);
          border: var(--border-width) solid transparent; }
.button--block { inline-size: 100%; min-block-size: var(--row-height); padding-inline: var(--spacing-16); font-size: var(--font-size-14); }
.button--inverse { background: var(--text-primary); color: var(--background-content); }
.button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
/* 禁用态：一眼看得出不可点（底色/字色/描边都走禁用档，光标 not-allowed） */
.button--inverse:disabled { background: var(--background-disabled); color: var(--text-disabled);
                            border-color: var(--border-disabled); cursor: not-allowed; }
/* 主按钮内部：横向居中的 inline-flex，便于放加载环 */
.button--block { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-8); }
/* 加载动画：按钮内的旋转环（纯 CSS，不引图片） */
.button.is-loading::before { content: ''; inline-size: 14px; block-size: 14px; flex: none;
  border: 2px solid currentColor; border-block-start-color: transparent; border-radius: 50%;
  animation: button-spin 0.7s linear infinite; }
@keyframes button-spin { to { transform: rotate(360deg); } }

/* 错误态：出错的控件自己变色（输入框边界→危险色；复选框边界→危险色、标签→危险文字色），
   错误行紧贴控件下方：小图标 + 危险色文字，左对齐。 */
.field .input.is-error { border-color: var(--danger); }
.field.is-error .field__label { color: var(--danger-ink); }
.terms.is-error input[type='checkbox'] { border-color: var(--danger); }
.terms.is-error label { color: var(--danger-ink); }
.error-line { display: flex; align-items: flex-start; gap: var(--spacing-4); margin: var(--spacing-4) 0 var(--spacing-12);
              color: var(--danger-ink); font-size: var(--font-size-13); text-align: start; }
.error-line .icon { inline-size: var(--spacing-16); block-size: var(--spacing-16); flex: none; margin-block-start: 2px; }
:lang(zh-CN) .error-line, :lang(zh-TW) .error-line, :lang(ja) .error-line { font-size: var(--font-size-minimum-cjk); }

.footnote { margin: var(--spacing-16) 0 0; text-align: center; font-size: var(--font-size-13); color: var(--text-secondary); }

/* 简繁日的最小字号：设计体系规定中文最小 12（--font-size-minimum-cjk），11 档只给拉丁/数字 */
:lang(zh-CN) .or, :lang(zh-TW) .or, :lang(ja) .or,
:lang(zh-CN) .footnote, :lang(zh-TW) .footnote, :lang(ja) .footnote,
:lang(zh-CN) .bottom, :lang(zh-TW) .bottom, :lang(ja) .bottom { font-size: var(--font-size-minimum-cjk); }

/* 底行：条款 */
.bottom { display: flex; justify-content: center; align-items: center; gap: var(--spacing-8); color: var(--text-tertiary); font-size: var(--font-size-11); }
.bottom a { color: var(--text-tertiary); }

/* 选择器与选项的排布：LOGO 在左，名称与域名在右竖排，文字从上方起排、左对齐。
   放在样式表末尾是为了压住上面 .picker__item / .picker 里的竖排与居中写法。 */
.picker, .picker__item { flex-direction: row; align-items: flex-start; justify-content: flex-start;
                         gap: var(--spacing-8); text-align: start; }
.picker__meta, .picker__item .picker__meta { align-items: flex-start; text-align: start; }
.picker .opt__logo, .picker__item .opt__logo { align-self: flex-start; margin-block-start: 2px; }
/* 列表永远浮在字段之上 */
.picker-wrap { position: relative; z-index: var(--z-popover); }
/* 名称与域名两行同一起点，不留额内边距与缩进 */
.picker__item-name, .picker__item-meta, .picker__name, .picker__url { padding: 0; margin: 0; text-indent: 0;
                                                                     text-align: start; align-self: stretch; }
/* 选择器与加载/空态共用同一固定高度：切换阶段时高度不跳 */
:root { --picker-h: calc(var(--spacing-48) + var(--spacing-16)); }
.picker, .picker--state { block-size: var(--picker-h); align-items: flex-start; }
.picker--state { align-items: center; }
/* 弹出列表压在输入框之上（此前用的 --z-popover 并不存在，所以层级失效） */
.picker-wrap { position: relative; z-index: var(--z-raised); }
.picker__list { z-index: var(--z-overlay); }
</style>
</head>
<body>
<!-- 界面图标：目前只有 icons.html 里的内联雪碧图，没有独立文件；这里内联本次用到的一个符号 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-server" viewBox="0 0 24 24"><rect width="20" height="8" x="2" y="2" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect width="20" height="8" x="2" y="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 6h.01M6 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

</defs></svg>

<div class="page">


  <div class="stage">
    <main class="card" aria-labelledby="auth-title">
      <h1 class="title"><span class="title__line" data-i18n="serversTitle">Choose a server</span></h1>

      <div class="picker-wrap" id="picker-wrap">
        <button class="picker" type="button" id="cloud-picker" aria-haspopup="listbox" aria-expanded="false">
          <span class="picker__meta">
            <img class="opt__logo" src="../logo-mark-celadon.svg" alt="" width="20" height="17">
            <span class="picker__name placeholder" id="cloud-name" data-i18n="cloudSelectHint">Select a cloud server</span>
            <span class="picker__url" id="cloud-url"></span>
            <span class="picker__url" id="cloud-url"></span>
          </span>
          <svg class="picker__arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"></use></svg>
        </button>
        <div class="picker__list" id="cloud-list" role="listbox" hidden></div>
      </div>

      <div class="picker picker--state" id="cloud-state">
        <span class="spinner" aria-hidden="true"></span><span data-i18n="cloudLoading">Loading cloud servers…</span>
      </div>

      <div class="picker-fail" id="cloud-failed" hidden>
        <p class="error-line"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-state-error"></use></svg><span data-i18n="cloudLoadFailed">Could not load the cloud server list</span></p>
        <button class="link" type="button" id="cloud-retry" data-i18n="cloudRetry">Retry</button>
      </div>

      <div class="field field--reveal" id="custom-field" hidden>
        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-server"></use></svg>
        <input class="input" id="custom-url" type="text" inputmode="url" autocapitalize="off" spellcheck="false"
               data-i18n-ph="customHint" placeholder="Enter the full server address, scheme included">
      </div>

      <p class="error-line" id="connect-error" role="alert" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-state-error"></use></svg><span></span>
      </p>
      <button class="button button--block button--inverse" type="button" id="connect" data-i18n="connect">Connect</button>

    </main>

  <div class="ctrl-wrap">
      <span class="ctrl">
        <button class="ctrl__btn" type="button" id="lang-btn" aria-haspopup="menu" aria-expanded="false">
          <span id="lang-label">English</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-globe"></use></svg>
        </button>
        <span class="ctrl__sep" aria-hidden="true"></span>
        <button class="ctrl__btn" type="button" id="theme-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Theme">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use id="theme-icon" href="#i-sun"></use></svg>
        </button>
      </span>
  
      <div class="menu" id="lang-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-lang="system">跟随系统（中文）</button>
        <button type="button" role="menuitemradio" data-lang="zh-CN">简体中文</button>
        <button type="button" role="menuitemradio" data-lang="zh-TW">繁體中文</button>
        <button type="button" role="menuitemradio" data-lang="en">English</button>
        <button type="button" role="menuitemradio" data-lang="ja">日本語</button>
      </div>
    </header>
  </div>
  </div>


</div>

<script>
/* 本页脚本：语言与主题（从平台层抄来，只为把设计做成"能用"）+ 服务器选择页的逻辑。
   产品里语言与主题在平台层，选择器与连接在页面里，各状态由真实接口驱动。 */
const LANGS = [
  { code: 'zh-CN', label: '简体中文' }, { code: 'zh-TW', label: '繁體中文' },
  { code: 'en', label: 'English' }, { code: 'ja', label: '日本語' },
]
let lang = document.documentElement.lang || 'en'
let theme = 'light'
const dictOf = (code) => (window.CELADON_I18N && window.CELADON_I18N[code] && window.CELADON_I18N[code].ui.entry) || {}

function applyLang(code) {
  lang = code
  document.documentElement.lang = code
  const dict = dictOf(code)
  document.querySelectorAll('[data-i18n]').forEach((el) => { const v = dict[el.dataset.i18n]; if (v !== undefined) el.textContent = v })
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { const v = dict[el.dataset.i18nPh]; if (v !== undefined) el.placeholder = v })
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { const v = dict[el.dataset.i18nAria]; if (v !== undefined) el.setAttribute('aria-label', v) })
  const current = LANGS.find((l) => l.code === code)
  document.getElementById('lang-label').textContent = current ? current.label : code
  document.querySelectorAll('#lang-menu [data-lang]').forEach((b) => b.classList.toggle('is-on', b.dataset.lang === code))
  if (typeof renderCloud === 'function') renderCloud()   /* 选择器里的名称等动态文案也要跟着换 */
}
function applyTheme(next) {
  theme = next === 'dark' ? 'dark' : 'light'
  document.documentElement.dataset.theme = theme
  document.getElementById('theme-icon').setAttribute('href', theme === 'dark' ? '#i-moon' : '#i-sun')
}
function toggleMenu(id, open) {
  const menu = document.getElementById(id)
  const btn = id === 'lang-menu' ? document.getElementById('lang-btn') : document.getElementById('theme-btn')
  const next = open === undefined ? menu.hidden : open
  document.querySelectorAll('.menu').forEach((m) => { m.hidden = true })
  document.querySelectorAll('.ctrl__btn').forEach((b) => b.setAttribute('aria-expanded', 'false'))
  menu.hidden = !next
  btn.setAttribute('aria-expanded', String(next))
}
document.getElementById('lang-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleMenu('lang-menu') })
document.getElementById('theme-btn').addEventListener('click', (e) => {
  e.stopPropagation(); applyTheme(theme === 'dark' ? 'light' : 'dark')      /* 直接切，不再开菜单 */
})
document.querySelectorAll('#lang-menu [data-lang]').forEach((b) => b.addEventListener('click', () => { applyLang(b.dataset.lang); toggleMenu('lang-menu', false) }))
document.addEventListener('click', () => toggleMenu('lang-menu', false))
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleMenu('lang-menu', false) })

/* ---- 服务器选择 ---- */
/* 假数据：产品里来自云站点接口（1.0 是 fetch_cloud_servers(cloudBase, locale)）。
   列表最后一项是「自建服务器」；选中它才出现地址输入。 */
const CUSTOM = '__custom__'
const CLOUD = [
  { key: 'serverApac', url: 'https://api.yaoagents.com' },
  { key: 'serverCn', url: 'https://api.yaoagents.cn' },
]
let cloudState = 'loading'        /* loading | ready | failed | empty */
let selected = CLOUD[0] ? CLOUD[0].url : CUSTOM
let listOpen = false

const pickerWrap = document.getElementById('picker-wrap')
const stateBox = document.getElementById('cloud-state')
const failedBox = document.getElementById('cloud-failed')
const listBox = document.getElementById('cloud-list')
const nameEl = document.getElementById('cloud-name')
const pickerBtn = document.getElementById('cloud-picker')
const customField = document.getElementById('custom-field')
const customInput = document.getElementById('custom-url')
const connectBtn = document.getElementById('connect')
const connectError = document.getElementById('connect-error')
const isCustom = () => selected === CUSTOM
const sub = (msg) => { connectError.querySelector('span').textContent = msg }

function renderCloud() {
  stateBox.hidden = cloudState !== 'loading' && cloudState !== 'empty'
  pickerWrap.hidden = cloudState !== 'ready'
  failedBox.hidden = cloudState !== 'failed'
  if (cloudState === 'loading') {
    stateBox.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' + dictOf(lang).cloudLoading + '</span>'
  } else if (cloudState === 'empty') {
    stateBox.innerHTML = '<span>' + dictOf(lang).cloudEmpty + '</span>'
  }
  if (cloudState !== 'ready') { customField.hidden = true; return }

  const found = CLOUD.find((c) => c.url === selected)
  nameEl.textContent = isCustom() ? dictOf(lang).customOption : (found ? dictOf(lang)[found.key] : dictOf(lang).cloudSelectHint)
  nameEl.classList.toggle('placeholder', !isCustom() && !found)
  customField.hidden = !isCustom()
  const urlEl = document.getElementById('cloud-url')
  if (urlEl) urlEl.textContent = isCustom() ? (customInput.value.trim() || '') : (found ? found.url.replace(/^https?:\/\//, '') : '')

  /* 每项两行：LOGO + 名称 / 域名。官方用品牌标记，自建用服务器图标、域名留空。 */
  const logo = (custom) => custom
    ? '<svg class="opt__logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-server"></use></svg>'
    : '<img class="opt__logo" src="../logo-mark-celadon.svg" alt="" width="20" height="17">'
  const bare = (u) => u.replace(/^https?:\/\//, '')
  const item = (url, label, domain, on) =>
    '<button class="picker__item' + (on ? ' is-on' : '') + '" type="button" role="option" data-url="' + url + '">' +
    logo(url === CUSTOM) +
    '<span class="picker__meta"><span class="picker__item-name">' + label + '</span>' +
    '<span class="picker__item-meta">' + domain + '</span></span></button>'
  listBox.innerHTML = CLOUD.map((c) => item(c.url, dictOf(lang)[c.key], bare(c.url), c.url === selected)).join('') +
    item(CUSTOM, dictOf(lang).customOption, dictOf(lang).customDesc, isCustom())
  listBox.querySelectorAll('[data-url]').forEach((el) => el.addEventListener('click', (e) => {
    e.stopPropagation(); selected = el.dataset.url; listOpen = false; connectError.hidden = true; renderCloud()
    if (isCustom()) customInput.focus()
  }))
  listBox.hidden = !listOpen
  pickerBtn.setAttribute('aria-expanded', String(listOpen))
}
function loadCloud() {
  cloudState = 'loading'; renderCloud()
  setTimeout(() => { cloudState = CLOUD.length ? 'ready' : 'empty'; renderCloud() }, 1100)
}
document.getElementById('cloud-retry').addEventListener('click', loadCloud)
pickerBtn.addEventListener('click', (e) => { e.stopPropagation(); listOpen = !listOpen; renderCloud() })
document.addEventListener('click', () => { if (listOpen) { listOpen = false; renderCloud() } })
customInput.addEventListener('input', () => {          /* 一改就清掉错误态 */
  customInput.classList.remove('is-error')
  customField.classList.remove('is-error')
  connectError.hidden = true
})
customInput.addEventListener('input', () => {           /* 一改就清掉错误态 */
  customInput.classList.remove('is-error')
  customField.classList.remove('is-error')
  connectError.hidden = true
})

function doConnect() {
  const custom = customInput.value.trim()
  if (isCustom() && !custom) {
    customInput.classList.add('is-error')                /* 出错的控件自己变色 */
    customField.classList.add('is-error')
    sub(dictOf(lang).customHint); connectError.hidden = false; customInput.focus(); return
  }
  if (!isCustom() && !selected) { sub(dictOf(lang).cloudSelectHint); connectError.hidden = false; return }
  connectError.hidden = true
  connectBtn.classList.add('is-loading')
  connectBtn.disabled = true
  connectBtn.textContent = dictOf(lang).connecting
  setTimeout(() => {
    connectBtn.classList.remove('is-loading')
    connectBtn.disabled = false
    applyLang(lang)
  }, 1800)
}
connectBtn.addEventListener('click', doConnect)
customInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doConnect() })

applyLang(lang)
applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
loadCloud()
</script></script>
</body>
</html>
